# Configuration for building the container image with ko (https://ko.build).
# The base image is the ko-base stage in images/Dockerfile, where Dependabot
# updates it. CI passes it to ko in KO_DEFAULTBASEIMAGE.
defaultPlatforms:
  - linux/amd64
builds:
  - id: trail-tools
    main: .
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
