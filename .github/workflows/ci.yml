name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Commits and merges with the workflow's token don't trigger workflows, so
  # the Dependabot jobs start runs themselves: on a pull request's branch to
  # check regenerated code, and on main to deploy a merge.
  workflow_dispatch:

# Third-party actions are pinned to commits, as tags can be moved to
# different code. The deploy job holds credentials that can change anything
# in the Google Cloud project. Dependabot updates the pins.

# A new push to a pull request cancels its now stale run. Runs on main all
# complete, so each commit is deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs that need more ask for it. Most jobs run code that Dependabot's pull
# requests update, before anyone has reviewed it.
permissions:
  contents: read

jobs:
  format:
    name: Check diff after formatting code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: format
      - name: Run make format
        run: |
          make format
          git diff --exit-code --name-only
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: format

  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: lint
      - name: Run make lint
        run: |
          make web-deps
          make lint
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: lint

  gen:
    name: Check diff after regenerating code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: gen
      - name: Run make gen
        run: |
          make web-deps
          make gen
          git diff --exit-code --name-only
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: gen

  build:
    name: Build Go code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["stable", "oldstable"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go-version }}
          cache-name: build-${{ matrix.go-version }}
      - name: Run go build
        run: go build ./...
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: build-${{ matrix.go-version }}

  test:
    name: Run Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS and pgRouting, matching the versions on Neon.
        image: pgrouting/pgrouting:18-3.6-3.8
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: test
      - name: Run go test
        run: go test -race ./...
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: test

  mod:
    name: Check diff after tidying go.mod and go.sum
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: mod
      - run: |
          make web-deps
          go mod tidy
          git diff --exit-code --name-only
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: mod
          modules: true

  terraform:
    name: Check Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Terraform version
        id: terraform-version
        # Kept in images/Dockerfile for Dependabot to update. The Makefile
        # applies locally with the same version.
        run: echo "version=$(images/image.sh --tag terraform)" >> "$GITHUB_OUTPUT"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
      - name: Check formatting and validate
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [format, lint, gen, build, test, mod, terraform]
    runs-on: ubuntu-latest
    # Only one deployment at a time. Terraform also locks its state.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      # Needed to authenticate to Google Cloud with Workload Identity
      # Federation, without stored credentials.
      id-token: write
    env:
      KO_DOCKER_REPO: us-west1-docker.pkg.dev/trail-tools-444904/trail-tools/server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: deploy
      - name: Read the Terraform version
        id: terraform-version
        # Kept in images/Dockerfile for Dependabot to update. The Makefile
        # applies locally with the same version.
        run: echo "version=$(images/image.sh --tag terraform)" >> "$GITHUB_OUTPUT"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/296221712346/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-terraform@trail-tools-444904.iam.gserviceaccount.com
      - name: Build and push the image
        run: |
          # The base image, kept in images/Dockerfile for Dependabot to
          # update.
          KO_DEFAULTBASEIMAGE=$(images/image.sh ko-base)
          export KO_DEFAULTBASEIMAGE
          echo "IMAGE=$(go tool ko build --bare --tags "${GITHUB_SHA},latest" .)" >> "$GITHUB_ENV"
      - name: Apply Terraform
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra apply -input=false -auto-approve -var "image=${IMAGE}"
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: deploy

  regenerate-dependabot:
    name: Regenerate code for Dependabot's pull request
    # Dependabot updates dependencies without regenerating the code that
    # depends on them, like the web app's bundle. Only pull requests
    # Dependabot opened in this repository.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Code generation runs the updated npm packages and Go tools, so it gets
    # a read-only token, which it doesn't keep in the checkout either. A
    # compromised dependency could otherwise push to main, or start the
    # deployment. commit-dependabot commits its changes, without running any
    # of the pull request's code.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: gen
      - name: Run make gen
        run: |
          make web-deps
          make gen
      - name: Save the regenerated code as a patch
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary > "$RUNNER_TEMP/regenerated.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Upload the patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-patch
          path: ${{ runner.temp }}/regenerated.patch
          retention-days: 1

  commit-dependabot:
    name: Commit regenerated code to Dependabot's pull request
    needs: regenerate-dependabot
    if: needs.regenerate-dependabot.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to start the checks of the regenerated commit.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.head_ref }}
    steps:
      # Keeps the token in the checkout to push the commit. This job runs
      # none of the checked out code.
      - name: Checkout code # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regenerated-patch
          path: ${{ runner.temp }}
      - name: Commit the regenerated code
        run: |
          git apply --index "$RUNNER_TEMP/regenerated.patch"
          # The patch comes from a job that ran the updated dependencies, so
          # only commit generated code, see AGENTS.md. Anything else needs a
          # person to look at it.
          git diff --cached --name-only | while read -r file; do
            case "$file" in
              internal/gen/* | internal/*/internal/gen/* | web/gen/* | web/dist/* | internal/apidesc/descriptor.binpb) ;;
              *)
                echo "::error::Regenerating code changed $file, which isn't generated code. Regenerate the code by hand and review the change."
                exit 1
                ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate code"
          # Fails if Dependabot pushed to the branch since, whose run
          # regenerates the code again.
          git push origin "HEAD:refs/heads/$BRANCH"
          # Pushes with the workflow's token don't trigger workflows, so start
          # the checks of the new commit, which merge it if they pass.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  merge-dependabot:
    name: Merge Dependabot's pull request
    # Pull requests Dependabot opened in this repository, once all checks
    # pass: those of the pull request, or of its branch, which
    # regenerate-dependabot checks after committing regenerated code.
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/dependabot/'))
    needs: [format, lint, gen, build, test, mod, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Needed to start the run on main that deploys the merge.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      # The commit the checks ran on.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Merge the pull request
        run: |
          author=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json author --jq .author.login)
          if [ "$author" != "app/dependabot" ]; then
            echo "The pull request of $BRANCH is by $author, not Dependabot"
            exit 1
          fi
          gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
      - name: Check and deploy main
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
