version: 2
# Each ecosystem's updates come in a single pull request, which CI merges once
# its checks pass, see the merge-dependabot job in workflows/ci.yml.
#
# Updates wait until a release is a week old. Compromised releases of
# packages and actions are usually found and pulled within days, and merged
# updates are deployed without review. Security updates don't wait.
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    # "/" only covers the workflows. The composite actions pin actions of
    # their own.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]

  # The Google provider, in infra/.terraform.lock.hcl. Its pull request has
  # a plan comment, but is applied once merged like any other update.
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]

  # The container images in images/Dockerfile, which the Makefile and CI
  # read, and the local and test database's in test/postgres. Not new major
  # versions of Postgres, which follows Neon's, or of Node, whose
  # odd-numbered versions aren't long-term supported.
  - package-ecosystem: "docker"
    directories: ["/images", "/test/postgres"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
