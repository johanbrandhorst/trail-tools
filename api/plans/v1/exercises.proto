syntax = "proto3";

package plans.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";
import "plans/v1/equipment.proto";
import "plans/v1/plans.proto";

// ExerciseService manages the user's exercise library: the strength and
// mobility exercises their strength workouts are made of, with how to do
// them, how they should feel and the muscles they work. Each exercise is
// defined once and reused across workouts (see
// TrainingPlanService.CreateWorkouts), so its history is kept: what the user
// did each time, with how it felt. Look an exercise up with ListExercises
// before creating it, and reuse it rather than creating a duplicate.
//
// The user does most strength workouts at home, so plan them with the
// equipment they have: see GetHomeEquipment. Exercises list the equipment
// they need, and strength workouts report the exercises the user lacks the
// equipment or weights for.
service ExerciseService {
  // Create one or more exercises. Fails with ALREADY_EXISTS if the user has
  // an exercise with the same name, ignoring case.
  rpc CreateExercises(CreateExercisesRequest) returns (CreateExercisesResponse);
  // List the user's exercises, by name.
  rpc ListExercises(ListExercisesRequest) returns (ListExercisesResponse);
  // Get an exercise by ID.
  rpc GetExercise(GetExerciseRequest) returns (GetExerciseResponse);
  // Update an exercise. Workouts and logs refer to the exercise, so they
  // show the change too.
  rpc UpdateExercise(UpdateExerciseRequest) returns (UpdateExerciseResponse);
  // Delete an exercise. Fails with FAILED_PRECONDITION if a workout or a log
  // refers to it: remove it from those workouts first, or keep it.
  rpc DeleteExercise(DeleteExerciseRequest) returns (DeleteExerciseResponse);
  // List what the user did in exercises, from the logs of their strength
  // workouts, in date order: the sets with their reps and weights, what was
  // planned, and how it felt. Use it to progress the weights and reps of
  // the next workouts, and to analyze training over time.
  rpc ListExerciseHistory(ListExerciseHistoryRequest) returns (ListExerciseHistoryResponse);
  // Get the equipment the user has at home, with the weights of their
  // dumbbells and kettlebells. Plan strength workouts with it.
  rpc GetHomeEquipment(GetHomeEquipmentRequest) returns (GetHomeEquipmentResponse);
  // Replace the list of equipment the user has at home. The user usually
  // does this in the web app's settings; only change it when they say what
  // they have.
  rpc SetHomeEquipment(SetHomeEquipmentRequest) returns (SetHomeEquipmentResponse);
  // Search Garmin's catalog of strength exercises, for an exercise's
  // garmin_exercise, e.g. "bulgarian split squat" or "dumbbell row". Garmin
  // watches show and count the exercises of the catalog when the workout is
  // on the user's Garmin calendar.
  rpc SearchGarminExercises(SearchGarminExercisesRequest) returns (SearchGarminExercisesResponse);
}

// Muscle is a muscle or muscle group an exercise works.
enum Muscle {
  MUSCLE_UNSPECIFIED = 0;
  MUSCLE_NECK = 1;
  // The trapezius and rhomboids.
  MUSCLE_UPPER_BACK = 2;
  // The latissimus dorsi.
  MUSCLE_LATS = 3;
  // The erector spinae.
  MUSCLE_LOWER_BACK = 4;
  // The deltoids.
  MUSCLE_SHOULDERS = 5;
  MUSCLE_CHEST = 6;
  MUSCLE_BICEPS = 7;
  MUSCLE_TRICEPS = 8;
  MUSCLE_FOREARMS = 9;
  // The rectus abdominis and deep core.
  MUSCLE_ABS = 10;
  MUSCLE_OBLIQUES = 11;
  // The iliopsoas and rectus femoris at the front of the hip.
  MUSCLE_HIP_FLEXORS = 12;
  // The gluteus maximus.
  MUSCLE_GLUTES = 13;
  // The gluteus medius and minimus at the side of the hip, which keep the
  // pelvis level on one leg.
  MUSCLE_HIP_ABDUCTORS = 14;
  // The inner thigh.
  MUSCLE_ADDUCTORS = 15;
  MUSCLE_QUADS = 16;
  MUSCLE_HAMSTRINGS = 17;
  // The gastrocnemius and soleus.
  MUSCLE_CALVES = 18;
  // The tibialis anterior at the front of the shin.
  MUSCLE_SHINS = 19;
  // The muscles of the foot and ankle.
  MUSCLE_FEET = 20;
}

// An exercise in the user's library.
message Exercise {
  // The ID of the exercise. Ignored when creating exercises.
  string id = 1;
  // The name, e.g. "Bulgarian split squat". Required, and unique among the
  // user's exercises, ignoring case.
  string name = 2;
  // How to do the exercise, step by step, e.g. "Rest the back foot
  // laces-down on a bench about knee height". At most 10 steps.
  repeated string instructions = 3;
  // How the exercise should feel and where, and what to watch out for, e.g.
  // "You should feel it in the front leg's glute and thigh. Sharp pain at
  // the front of the knee means stop: shorten the stance." Empty if none.
  string feel = 4;
  // The muscles the exercise works hardest.
  repeated Muscle primary_muscles = 5;
  // The muscles the exercise also works.
  repeated Muscle secondary_muscles = 6;
  // The equipment needed. Empty for bodyweight exercises. An exercise that
  // can be done with dumbbells or a kettlebell lists the one it's usually
  // done with; planning chooses the weight.
  repeated Equipment equipment = 7;
  // Whether the exercise is done on each side in turn, like a lunge, so
  // planned and logged reps and hold times are per side.
  bool each_side = 8;
  // When the exercise was created.
  google.protobuf.Timestamp create_time = 9 [(mcp.v1.field).output_only = true];
  // When the exercise was last updated.
  google.protobuf.Timestamp update_time = 10 [(mcp.v1.field).output_only = true];
  // More about the equipment, e.g. "A bench at about knee height". Empty if
  // none.
  string equipment_notes = 11;
  // Short looping animations of a stick figure doing the exercise, shown to
  // the user as they do it: usually one of the movement, and maybe one of
  // setting up. At most 3.
  repeated ExerciseAnimation animations = 12;
  // The exercise of Garmin's catalog this is, as "CATEGORY/NAME", e.g.
  // "LUNGE/DUMBBELL_BULGARIAN_SPLIT_SQUAT", from SearchGarminExercises.
  // Garmin watches show and count it as that exercise. Empty to match it by
  // the exercise's name, if one of the catalog is named the same; an
  // exercise without one is shown by its name, without counting reps.
  string garmin_exercise = 13;
}

// A short looping animation of a stick figure doing an exercise, seen from
// the side, facing right. It's a few key poses the figure moves between,
// back to the first after the last. One point of the body, the anchor,
// stays where it is, and the figure moves around it; planted hands and feet
// stay where they are in the first pose too, their knee or elbow bending to
// keep them there. The floor is under the lowest point of the first pose
// that no prop supports.
message ExerciseAnimation {
  // What the animation shows, e.g. "The movement" or "Setting up".
  // Required.
  string title = 1;
  // The point of the body that stays where it is, e.g. the front foot of a
  // split squat. Required.
  BodyPoint anchor = 2;
  // Other hands and feet that stay where they are in the first pose, e.g.
  // the back foot on the bench of a split squat.
  repeated BodyPoint planted = 3;
  // The equipment shown, e.g. a bench under the back foot and dumbbells in
  // the hands. At most 6.
  repeated AnimationProp props = 4;
  // The key poses, in order. Between 2 and 8.
  repeated AnimationKeyframe keyframes = 5;
}

// BodyPoint is a point of the stick figure. Near limbs are on the viewer's
// side, and far limbs behind them.
enum BodyPoint {
  BODY_POINT_UNSPECIFIED = 0;
  BODY_POINT_HEAD = 1;
  BODY_POINT_SHOULDERS = 2;
  BODY_POINT_HIPS = 3;
  BODY_POINT_NEAR_ELBOW = 4;
  BODY_POINT_NEAR_HAND = 5;
  BODY_POINT_FAR_ELBOW = 6;
  BODY_POINT_FAR_HAND = 7;
  BODY_POINT_NEAR_KNEE = 8;
  BODY_POINT_NEAR_FOOT = 9;
  BODY_POINT_FAR_KNEE = 10;
  BODY_POINT_FAR_FOOT = 11;
}

// AnimationPropKind is a piece of equipment in an animation.
enum AnimationPropKind {
  ANIMATION_PROP_KIND_UNSPECIFIED = 0;
  // A bench under the point, e.g. a foot or the shoulders.
  ANIMATION_PROP_KIND_BENCH = 1;
  // A low step or box under the point.
  ANIMATION_PROP_KIND_STEP = 2;
  // A dumbbell in the hand at the point.
  ANIMATION_PROP_KIND_DUMBBELL = 3;
  // A kettlebell in the hand at the point.
  ANIMATION_PROP_KIND_KETTLEBELL = 4;
  // A mat on the floor under the whole figure; it takes no point.
  ANIMATION_PROP_KIND_MAT = 5;
  // A bar held by the hand at the point, like a pull-up bar.
  ANIMATION_PROP_KIND_BAR = 6;
}

// A piece of equipment in an animation, where it is in the first pose.
message AnimationProp {
  // What it is. Required.
  AnimationPropKind kind = 1;
  // The point it's at: under the point for benches and steps, in the hand
  // for weights, or held by the hand for bars. Unset for mats.
  BodyPoint point = 2;
}

// A key pose of an animation.
message AnimationKeyframe {
  // The pose. Required.
  Pose pose = 1;
  // How long the figure takes to move into this pose from the previous one,
  // or from the last for the first, in milliseconds, e.g. 3000 for three
  // seconds down. At most 10000.
  int32 move_milliseconds = 2;
  // How long the figure holds the pose, in milliseconds. At most 10000.
  int32 hold_milliseconds = 3;
  // A short cue shown during the move and hold, e.g. "Lower for 3 s".
  // Empty if none.
  string cue = 4;
  // A point to circle while the pose is held, to draw the eye to it, e.g.
  // the front knee staying over the foot. Unspecified for none.
  BodyPoint highlight = 5;
}

// A pose of the stick figure, as the direction of each body segment from
// the joint it starts at, in degrees, seen from the side with the figure
// facing right: 0 points straight down, 90 straight forward, 180 straight
// up and -90 straight back. Standing tall is a torso and head of 180, and
// thighs, shins and arms of 0; a thigh parallel to the floor in front is 90.
// The segments are the same length in every pose, so the figure keeps its
// proportions.
message Pose {
  // From the hips to the shoulders.
  double torso_degrees = 1;
  // From the shoulders to the head.
  double head_degrees = 2;
  // From the hip to the knee of the near leg.
  double near_thigh_degrees = 3;
  // From the knee to the ankle of the near leg.
  double near_shin_degrees = 4;
  // From the hip to the knee of the far leg.
  double far_thigh_degrees = 5;
  // From the knee to the ankle of the far leg.
  double far_shin_degrees = 6;
  // From the shoulder to the elbow of the near arm.
  double near_upper_arm_degrees = 7;
  // From the elbow to the hand of the near arm.
  double near_forearm_degrees = 8;
  // From the shoulder to the elbow of the far arm.
  double far_upper_arm_degrees = 9;
  // From the elbow to the hand of the far arm.
  double far_forearm_degrees = 10;
}

// What the user did in an exercise in one strength workout.
message ExerciseHistoryEntry {
  // The date of the workout (YYYY-MM-DD).
  string date = 1;
  // The ID of the workout. Empty if the workout has since been deleted.
  string workout_id = 2;
  // The title of the workout. Empty if the workout has since been deleted.
  string workout_title = 3;
  // What was planned for the exercise, as it was when the log was saved.
  // Unset if the exercise wasn't planned for the workout.
  PlannedExercise planned = 4;
  // What the user did and how it felt.
  LoggedExercise logged = 5;
  // How hard the whole session felt.
  SessionEffort session_effort = 6;
}

message CreateExercisesRequest {
  // The exercises to create. Maximum 100.
  repeated Exercise exercises = 1;
}

message CreateExercisesResponse {
  // The created exercises, in the order given.
  repeated Exercise exercises = 1;
}

message ListExercisesRequest {}

message ListExercisesResponse {
  // The user's exercises, by name.
  repeated Exercise exercises = 1;
}

message GetExerciseRequest {
  // The ID of the exercise.
  string id = 1;
}

message GetExerciseResponse {
  // The exercise.
  Exercise exercise = 1;
}

message UpdateExerciseRequest {
  // The exercise to update. The ID must be set.
  Exercise exercise = 1;
  // The fields to update, e.g. "instructions,feel". If empty, all fields
  // are replaced.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateExerciseResponse {
  // The updated exercise.
  Exercise exercise = 1;
}

message DeleteExerciseRequest {
  // The ID of the exercise.
  string id = 1;
}

message DeleteExerciseResponse {}

message ListExerciseHistoryRequest {
  // The IDs of the exercises. If empty, the history of all the user's
  // exercises is listed.
  repeated string exercise_ids = 1;
  // Only include workouts on or after this date (YYYY-MM-DD).
  string start_date = 2;
  // Only include workouts on or before this date (YYYY-MM-DD).
  string end_date = 3;
}

message ListExerciseHistoryResponse {
  // The entries in date order, then in the order the exercises were done.
  repeated ExerciseHistoryEntry entries = 1;
}

message GetHomeEquipmentRequest {}

message GetHomeEquipmentResponse {
  // The equipment the user has at home, in the order of the Equipment
  // enum. Empty if they have none, or haven't said yet.
  repeated OwnedEquipment equipment = 1;
  // When the list was last set. Unset if the user hasn't said what they
  // have yet: then don't assume they have no equipment, ask them.
  google.protobuf.Timestamp update_time = 2;
}

message SetHomeEquipmentRequest {
  // The equipment the user has at home, replacing the earlier list.
  repeated OwnedEquipment equipment = 1;
}

message SetHomeEquipmentResponse {
  // The equipment the user has at home.
  repeated OwnedEquipment equipment = 1;
  // When the list was set.
  google.protobuf.Timestamp update_time = 2;
}

message SearchGarminExercisesRequest {
  // The words to search for in the exercises' categories and names, e.g.
  // "split squat". Required.
  string query = 1;
  // The most exercises to return, 20 by default and at most 100.
  int32 page_size = 2;
}

message SearchGarminExercisesResponse {
  // The matching exercises, the shortest names first.
  repeated GarminExercise exercises = 1;
}

// An exercise of Garmin's catalog.
message GarminExercise {
  // The exercise as an exercise's garmin_exercise, "CATEGORY/NAME".
  string id = 1;
  // The category, e.g. "LUNGE".
  string category = 2;
  // The name, e.g. "DUMBBELL_BULGARIAN_SPLIT_SQUAT".
  string name = 3;
}
