// WeatherLocationSource is where a workout's forecast is for.
enum WeatherLocationSource {
  WEATHER_LOCATION_SOURCE_UNSPECIFIED = 0;
  // The workout's location.
  WEATHER_LOCATION_SOURCE_WORKOUT_LOCATION = 3;
  // The start of the workout's route.
  WEATHER_LOCATION_SOURCE_ROUTE_START = 1;
  // Where the user's most recent activity started, for workouts without a
  // location or route.
  WEATHER_LOCATION_SOURCE_LATEST_ACTIVITY = 2;
}

// The weather forecast for the day of a workout.
message WorkoutWeather {
  // The ID of the workout.
  string workout_id = 1;
  // The date of the workout (YYYY-MM-DD).
  string date = 2;
  // Where the forecast is for.
  geo.v1.LatLng location = 3;
  // Where the location comes from.
  WeatherLocationSource location_source = 4;
  // The weather during the daytime, from 06:00 to 21:00 local time.
  DayWeather day = 5;
  // The forecast for each hour of the daytime, and of the workout if it's
  // outside it. Only set by GetWorkoutWeather.
  repeated HourWeather hours = 6;
  // The weather during the workout: from the start of its start window to
  // the end of the window plus the workout's expected duration, see
  // FuelAmounts.expected_duration_seconds, or an hour if it has none. Unset
  // for workouts without a start time.
  DayWeather workout = 7;
  // When that period starts and ends.
  google.protobuf.Timestamp workout_start_time = 8;
  google.protobuf.Timestamp workout_end_time = 9;
  // What to eat and drink during a run with a fueling plan, adjusted for the
  // heat during the workout. Unset for other workouts, and for runs without
  // a start time or whose time can't be estimated.
  FuelAmounts fueling = 10;
  // Dangers in the forecast for this workout, which the user should know
  // about before going: suggest changing the route or the day. Empty if
  // there are none.
  repeated WeatherWarning warnings = 11;
  // The avalanche forecast for ski tours, at the forecast's location. Unset
  // for other workouts, and where there is none: forecasts only cover
  // Canada's mountains in winter. Its days only cover the next three, so
  // check that the workout's date is among them. See
  // geo.v1.GeoService.GetAvalancheForecast.
  geo.v1.AvalancheForecast avalanche_forecast = 12;
  // For ski tours, the forecast checked against the user's touring limits,
  // during the workout if it has a start time, or else the daytime. Unset
  // for other workouts, and if the user hasn't set any limits.
  geo.v1.TouringVerdict touring_verdict = 13;
}

// WeatherWarningKind is the kind of danger a weather warning is about.
enum WeatherWarningKind {
  WEATHER_WARNING_KIND_UNSPECIFIED = 0;
  // High winds are forecast while the workout is in forest, where they
  // bring down branches and trees: gusts of at least 60 km/h, gale force,
  // during the workout, or during the daytime for a workout without a start
  // time. The workout is taken to be in forest if at least 300 meters of its
  // route is, or, without a route, if most of the trails within a kilometer
  // of its location are. Forests come from OpenStreetMap, so they are only
  // known in the regions whose map data has been imported.
  WEATHER_WARNING_KIND_WIND_IN_FOREST = 1;
  // The avalanche danger on the day of a ski tour is High or Extreme in an
  // elevation band, when travel in avalanche terrain is not recommended.
  WEATHER_WARNING_KIND_AVALANCHE_DANGER = 2;
}

// A danger in the forecast for a workout.
message WeatherWarning {
  // What the danger is.
  WeatherWarningKind kind = 1;
  // The warning for the user, saying what's forecast and what to do, e.g.
  // "Gusts up to 75 km/h are forecast during the run, and 6.2 km of its
  // route is in forest, where wind brings down branches and trees. Choose a
  // route in the open, or move the run to a calmer day."
  string message = 2;
  // The strongest gusts forecast in kilometers per hour, for wind warnings.
  double max_wind_gusts_kmh = 3;
  // How many meters of the workout's route are in forest. 0 for workouts
  // without a route, whose surroundings are mostly forest instead.
  double forest_distance_meters = 4;
  // The highest danger rated on the day, for avalanche warnings.
  geo.v1.AvalancheDanger max_avalanche_danger = 5;
}

// The weather of a day.
message DayWeather {
  // The lowest and highest air temperature in degrees Celsius.
  double min_temperature_celsius = 1;
  double max_temperature_celsius = 2;
  // The highest chance of precipitation in percent.
  int32 max_precipitation_probability = 3;
  // The total precipitation in millimeters.
  double precipitation_mm = 4;
  // The total snowfall in centimeters.
  double snowfall_cm = 5;
  // The strongest wind and gusts in kilometers per hour.
  double max_wind_speed_kmh = 6;
  double max_wind_gusts_kmh = 7;
  // The most severe WMO weather code of the day, as used by Open-Meteo.
  int32 weather_code = 8;
  // A description of the weather code, e.g. "Light rain".
  string description = 9;
  // The lowest height of the 0 degree Celsius level in meters, 0 if
  // unknown. Above it, rain falls as snow and wet snow refreezes.
  double min_freezing_level_meters = 10;
  // The deepest modeled snow on the ground in centimeters. The model's grid
  // is a few kilometers wide, so in the mountains it's a rough guide that
  // can be far off on a given slope.
  double max_snow_depth_cm = 11;
  // The snow that fell in the 72 hours before the period, in centimeters.
  // New snow is what makes avalanches likely: check the avalanche forecast
  // after a lot of it.
  double snowfall_past_72_hours_cm = 12;
}

// The weather forecast for an hour.
message HourWeather {
  // The start of the hour.
  google.protobuf.Timestamp time = 1;
  // Air temperature in degrees Celsius.
  double temperature_celsius = 2;
  // Apparent (feels like) temperature in degrees Celsius.
  double apparent_temperature_celsius = 3;
  // The chance of precipitation in percent.
  int32 precipitation_probability = 4;
  // Precipitation in millimeters.
  double precipitation_mm = 5;
  // The WMO weather code, as used by Open-Meteo.
  int32 weather_code = 6;
  // Wind and gusts in kilometers per hour, and where the wind comes from in
  // degrees.
  double wind_speed_kmh = 7;
  double wind_gusts_kmh = 8;
  int32 wind_direction_degrees = 9;
  // Whether it is daylight.
  bool is_day = 10;
  // Snowfall in centimeters.
  double snowfall_cm = 11;
  // The height of the 0 degree Celsius level in meters.
  double freezing_level_meters = 12;
  // The modeled depth of the snow on the ground in centimeters.
  double snow_depth_cm = 13;
}

message ListWorkoutWeatherRequest {
  // The first and last date of the range (YYYY-MM-DD).
  string start_date = 1;
  string end_date = 2;
}

message ListWorkoutWeatherResponse {
  // The forecasts of the workouts that have one, in date order.
  repeated WorkoutWeather weather = 1;
}

// How the user sweats. With it, a run's fueling estimates how much the user
// sweats on the run, from their sweat rate, the forecast's apparent
// temperature and how hard the run is, and the sodium they lose in it. A
// run whose fueling has no sodium rate of its own replaces that sodium.
message SweatProfile {
  // How much sodium a liter of the user's sweat has in milligrams, from a
  // sweat test, from 100 to 4000. Typically 200 to 2000; salty sweaters
  // are above 1000. Unset if unknown. Tests that report mmol/L: multiply
  // by 23.
  optional double sodium_mg_per_liter = 1;
  // How many milliliters an hour the user sweats running easy at mild
  // temperatures, from 200 to 3000, e.g. weighed before and after an hour's
  // run: each kilogram lost is a liter, plus what they drank. Unset if
  // unmeasured: 800 ml an hour is assumed. It rises 5% for each degree the
  // run feels above 15 degrees Celsius, up to double, falls 2% for each
  // degree below, down to 60%, and is 20% higher for hard runs.
  optional double rate_ml_per_hour = 2;
  // When the profile was last set. Unset if it never was.
  google.protobuf.Timestamp update_time = 3 [(mcp.v1.field).output_only = true];
}

message GetSweatProfileRequest {}

message GetSweatProfileResponse {
  // The user's sweat profile, empty if they haven't set one.
  SweatProfile profile = 1;
}

message SetSweatProfileRequest {
  // The user's sweat profile, replacing the earlier one.
  SweatProfile profile = 1;
}

message SetSweatProfileResponse {
  // The user's sweat profile.
  SweatProfile profile = 1;
}

// The user's own limits for ski touring: the conditions they won't tour
// in. The forecasts of ski tours are checked against them: beyond a limit
// is a no-go, and close to one, or without the data to check one, a
// caution. Unset limits aren't checked.
message TouringLimits {
  // The highest avalanche danger the user will tour in, per elevation
  // band. Unspecified for no limit.
  geo.v1.AvalancheDanger max_avalanche_danger_alpine = 1;
  geo.v1.AvalancheDanger max_avalanche_danger_treeline = 2;
  geo.v1.AvalancheDanger max_avalanche_danger_below_treeline = 3;
  // The strongest gusts the user will tour in, in kilometers per hour,
  // from 10 to 200. Within 10 km/h of it is a caution.
  optional double max_wind_gusts_kmh = 4;
  // The highest freezing level the user will tour under, in meters, from
  // 100 to 6000: warming makes wet avalanches and loose snow likely.
  // Within 200 m of it is a caution.
  optional double max_freezing_level_meters = 5;
  // The most snow fallen in the 72 hours before a tour the user will tour
  // in, in centimeters, from 1 to 300: new snow makes avalanches likely.
  // Within 5 cm of it is a caution.
  optional double max_snowfall_past_72_hours_cm = 6;
  // When the limits were last set. Unset if they never were.
  google.protobuf.Timestamp update_time = 7 [(mcp.v1.field).output_only = true];
}

message GetTouringLimitsRequest {}

message GetTouringLimitsResponse {
  // The user's touring limits, empty if they haven't set any.
  TouringLimits limits = 1;
}

message SetTouringLimitsRequest {
  // The user's touring limits, replacing the earlier ones.
  TouringLimits limits = 1;
}

message SetTouringLimitsResponse {
  // The user's touring limits.
  TouringLimits limits = 1;
}

