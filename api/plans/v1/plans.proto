syntax = "proto3";

package plans.v1;

import "geo/v1/geo.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";
import "plans/v1/equipment.proto";

// TrainingPlanService manages training plans of up to a year leading to one or
// more goal races. A plan is organised at three levels:
//
// 1. Months: the training phase (e.g. base, build, peak, taper) and monthly
//    volume targets.
// 2. Weeks: the weekly focus and volume targets. Weeks start on Monday.
// 3. Days: individual workouts: runs, optionally linked to a route,
//    cross-training, strength training, races and rest days.
//
// Months and weeks are both plan periods, created with SetPlanPeriods. Workouts
// are created in bulk with CreateWorkouts. Strength workouts list exercises
// from the user's exercise library, see ExerciseService, and the user logs
// what they did in them in the web app. Dates are local dates in the format
// YYYY-MM-DD. Compare the plan with what was actually run using
// ActivityService.SummarizeActivities and ActivityService.ListActivities.
service TrainingPlanService {
  // Create a training plan.
  rpc CreateTrainingPlan(CreateTrainingPlanRequest) returns (CreateTrainingPlanResponse);
  // Get a training plan with its month and week periods. Workouts are listed
  // separately with ListWorkouts.
  rpc GetTrainingPlan(GetTrainingPlanRequest) returns (GetTrainingPlanResponse);
  // List the user's training plans, most recent start date first.
  rpc ListTrainingPlans(ListTrainingPlansRequest) returns (ListTrainingPlansResponse);
  // Update a training plan's details. Fails with FAILED_PRECONDITION if the
  // new start_date and end_date would leave workouts, weeks or months of the
  // plan outside them, naming their dates: move or delete those first with
  // UpdateWorkout, DeleteWorkouts or DeletePlanPeriods.
  rpc UpdateTrainingPlan(UpdateTrainingPlanRequest) returns (UpdateTrainingPlanResponse);
  // Delete a training plan, including its periods and workouts.
  rpc DeleteTrainingPlan(DeleteTrainingPlanRequest) returns (DeleteTrainingPlanResponse);
  // Create or replace month and week periods. A period is identified by its
  // granularity and start date; setting a period that already exists replaces
  // it. Start dates are normalised to the first of the month for months and
  // to Monday for weeks.
  rpc SetPlanPeriods(SetPlanPeriodsRequest) returns (SetPlanPeriodsResponse);
  // Delete month or week periods: those with the given IDs, or all those of
  // a granularity, a date range, or both, e.g. every week to replan them.
  rpc DeletePlanPeriods(DeletePlanPeriodsRequest) returns (DeletePlanPeriodsResponse);
  // List a plan's workouts, or those of all the user's plans, in date order,
  // each day's by start time, optionally within a date range.
  rpc ListWorkouts(ListWorkoutsRequest) returns (ListWorkoutsResponse);
  // Get a workout by ID.
  rpc GetWorkout(GetWorkoutRequest) returns (GetWorkoutResponse);
  // Create one or more workouts in a plan. A day may have several workouts.
  rpc CreateWorkouts(CreateWorkoutsRequest) returns (CreateWorkoutsResponse);
  // Update a workout.
  rpc UpdateWorkout(UpdateWorkoutRequest) returns (UpdateWorkoutResponse);
  // Delete one or more workouts. The logs of deleted strength workouts are
  // kept in the history of their exercises.
  rpc DeleteWorkouts(DeleteWorkoutsRequest) returns (DeleteWorkoutsResponse);
  // Save what the user did in a strength workout, replacing any earlier log,
  // which completes the workout. The user usually does this in the web app
  // as they finish the workout. Links the workout to the user's strength
  // activity of the same day, if it has none. Fails with
  // FAILED_PRECONDITION if the workout isn't a strength workout.
  rpc SetStrengthLog(SetStrengthLogRequest) returns (SetStrengthLogResponse);
  // Delete the log of a strength workout, so it's no longer complete. Its
  // sets are removed from the history of its exercises.
  rpc DeleteStrengthLog(DeleteStrengthLogRequest) returns (DeleteStrengthLogResponse);
  // List the weather forecast for the days of the user's workouts in a date
  // range, without hourly forecasts. Forecasts are available up to 15 days
  // ahead, so workouts after that and before today are left out, as are rest
  // days and strength training, which don't need one.
  rpc ListWorkoutWeather(ListWorkoutWeatherRequest) returns (ListWorkoutWeatherResponse);
  // Get the weather forecast for the day of a workout, with the forecast
  // for each hour of the daytime.
  rpc GetWorkoutWeather(GetWorkoutWeatherRequest) returns (GetWorkoutWeatherResponse);
}

// A training plan.
message TrainingPlan {
  // The ID of the plan. Ignored when creating a plan.
  string id = 1;
  // The name of the plan.
  string name = 2;
  // A description of the plan: the athlete's background, goals, constraints
  // and the overall approach.
  string description = 3;
  // The first day of the plan (YYYY-MM-DD).
  string start_date = 4;
  // The last day of the plan (YYYY-MM-DD). At most 366 days after the start.
  string end_date = 5;
  // The IDs of the goal races the plan builds towards. See RaceService. They
  // are added to the user's calendar.
  repeated string goal_race_ids = 6;
  // When the plan was created.
  google.protobuf.Timestamp create_time = 7 [(mcp.v1.field).output_only = true];
  // When the plan was last updated.
  google.protobuf.Timestamp update_time = 8 [(mcp.v1.field).output_only = true];
}

// PeriodGranularity is the length of a plan period.
enum PeriodGranularity {
  PERIOD_GRANULARITY_UNSPECIFIED = 0;
  // A calendar month.
  PERIOD_GRANULARITY_MONTH = 1;
  // A week starting on Monday.
  PERIOD_GRANULARITY_WEEK = 2;
}

// A month or week in a training plan, with its focus and volume targets.
message PlanPeriod {
  // The ID of the period.
  string id = 1 [(mcp.v1.field).output_only = true];
  // Whether this is a month or a week.
  PeriodGranularity granularity = 2;
  // The first day of the period (YYYY-MM-DD). The first of the month for
  // months, a Monday for weeks.
  string start_date = 3;
  // A short title, e.g. "Base 2", "Recovery week" or "Taper".
  string title = 4;
  // The focus of the period and any notes, e.g. key workouts and the reason
  // for the volume.
  string notes = 5;
  // Target distance in meters. 0 if not set.
  double target_distance_meters = 6;
  // Target elevation gain in meters. 0 if not set.
  double target_elevation_gain_meters = 7;
  // Target moving time in seconds. 0 if not set.
  int32 target_duration_seconds = 8;
}

// WorkoutType is the type of a workout, for filtering and display. It's set
// from the workout's details: a run's intensity, or its kind. The workout's
// title and description say what it is, e.g. "Tempo 3x10 min" or "Long
// run".
enum WorkoutType {
  WORKOUT_TYPE_UNSPECIFIED = 0;
  // Aerobic running: easy, recovery and long runs, and steady vert.
  WORKOUT_TYPE_BASE = 13;
  // Hard running: tempo, intervals and hill repeats.
  WORKOUT_TYPE_INTENSITY = 14;
  // Cycling, swimming, skiing or other non-running cardio.
  WORKOUT_TYPE_CROSS_TRAINING = 9;
  // Strength and mobility training.
  WORKOUT_TYPE_STRENGTH = 10;
  // A race, either a goal race or a tune-up.
  WORKOUT_TYPE_RACE = 11;
  // A rest day.
  WORKOUT_TYPE_REST = 8;

  // Deprecated: use WORKOUT_TYPE_BASE.
  WORKOUT_TYPE_EASY = 1 [deprecated = true];
  // Deprecated: use WORKOUT_TYPE_BASE.
  WORKOUT_TYPE_LONG_RUN = 2 [deprecated = true];
  // Deprecated: use WORKOUT_TYPE_INTENSITY.
  WORKOUT_TYPE_TEMPO = 3 [deprecated = true];
  // Deprecated: use WORKOUT_TYPE_INTENSITY.
  WORKOUT_TYPE_INTERVALS = 4 [deprecated = true];
  // Deprecated: use WORKOUT_TYPE_INTENSITY.
  WORKOUT_TYPE_HILL_REPEATS = 5 [deprecated = true];
  // Deprecated: use WORKOUT_TYPE_BASE.
  WORKOUT_TYPE_VERT = 6 [deprecated = true];
  // Deprecated: use WORKOUT_TYPE_BASE.
  WORKOUT_TYPE_RECOVERY = 7 [deprecated = true];
  // Deprecated: use WORKOUT_TYPE_CROSS_TRAINING.
  WORKOUT_TYPE_OTHER = 12 [deprecated = true];
}

// A workout planned for a day. What a workout is, and what can be planned
// for it, depends on its kind: exactly one of run, cross_training, strength,
// race and rest must be set.
message Workout {
  // The ID of the workout. Ignored when creating workouts.
  string id = 1;
  // The ID of the plan the workout belongs to.
  string plan_id = 2 [(mcp.v1.field).output_only = true];
  // The date of the workout (YYYY-MM-DD).
  string date = 3;
  // The type of workout, set from which of run, cross_training, strength,
  // race and rest is set. Ignored in requests.
  WorkoutType type = 4 [(mcp.v1.field).output_only = true];
  // A short title, e.g. "Long run with 1000m vert".
  string title = 5;
  // A description of the workout: structure, intensity and purpose.
  string description = 6;
  // The ID of the activity that completed this workout, if any. See
  // ActivityService. As activities sync, workouts without one are linked to
  // an activity of the same day that no other workout has: runs and races to
  // a run, strength workouts to strength training, and cross-training to
  // any other sport but walks. Several workouts of a kind on a day are
  // paired with that day's activities in order of their start times. Clear
  // it to remove a wrong link: the workout then isn't linked again until it
  // is set by hand.
  string completed_activity_id = 12;
  // The earliest local time to start the workout (HH:MM, 24 hour clock).
  // Empty if it can be done any time of the day. The weather forecast of
  // runs covers the start window and the time the run takes.
  string start_time = 18;
  // How long the start window is in minutes, e.g. 60 to start between 07:00
  // and 08:00. Between 15 and 360 if start_time is set; 0 means 60.
  int32 start_window_minutes = 19;
  // Where the workout starts, for workouts without a route, like a group
  // run's meeting point or the gym of a strength session. The weather
  // forecast is for it, before the start of the route. Unset if not given.
  geo.v1.LatLng location = 20;
  // A short name for the location, e.g. "Trailhead parking". Empty if none.
  string location_name = 21;
  // The link anyone can view the workout with, and download its route and
  // watch files, without signing in, if it's shared. See
  // WorkoutShareService.
  string share_url = 22 [(mcp.v1.field).output_only = true];

  // What the workout is. Exactly one must be set.
  oneof details {
    // A run: easy, long or hard.
    RunWorkout run = 13;
    // Cycling, swimming, skiing or other non-running cardio.
    CrossTrainingWorkout cross_training = 14;
    // Strength and mobility training, with its exercises.
    StrengthWorkout strength = 15;
    // A race, either a goal race or a tune-up.
    RaceWorkout race = 16;
    // A rest day.
    RestDay rest = 17;
  }

  reserved 7, 8, 9, 10, 11;
  reserved "target_distance_meters", "target_elevation_gain_meters", "target_duration_seconds", "target_terrain", "route_id";
}

// RunIntensity is how hard a run is.
enum RunIntensity {
  RUN_INTENSITY_UNSPECIFIED = 0;
  // Aerobic running: easy, recovery and long runs, and steady vert.
  RUN_INTENSITY_BASE = 1;
  // Hard running: tempo, intervals and hill repeats.
  RUN_INTENSITY_HARD = 2;
}

// A run.
message RunWorkout {
  // How hard the run is. Required.
  RunIntensity intensity = 1;
  // Target distance in meters. 0 if not set.
  double target_distance_meters = 2;
  // Target elevation gain in meters. 0 if not set.
  double target_elevation_gain_meters = 3;
  // Target moving time in seconds. 0 if not set.
  int32 target_duration_seconds = 4;
  // The preferred terrain, if any.
  geo.v1.Terrain target_terrain = 5;
  // The ID of the route to run, if any. See RouteService.
  string route_id = 6;
  // The structure of the run, in order: e.g. a warm-up, 6 x (3 minutes
  // hard, 2 minutes easy) and a cool-down. Empty for a run without
  // structure, like an easy run. Garmin watches guide the steps and alert
  // outside their targets. At most 20 blocks, and 50 steps in all, counting
  // each block's steps once however often it's repeated.
  repeated RunBlock blocks = 7;
  // Whether the run is a blood lactate test: stages of a few minutes at
  // rising heart rates, with the lactate measured after each, to find the
  // aerobic threshold. See LactateTestService. Its workout page starts the
  // test, or creates a link for someone else to record it, and the test is
  // linked to the workout. Plan it as a base run without blocks: the
  // stages are chosen when the test starts.
  bool lactate_test = 8;
}

// A block of a structured run: its steps, done once or repeated.
message RunBlock {
  // How often the steps are done, e.g. 6 for 6 x (3 minutes hard, 2
  // minutes easy). From 1 to 50; 0 means 1.
  int32 repeats = 1;
  // The steps, in order. At least one.
  repeated RunStep steps = 2;
}

// RunStepKind is what a step of a structured run is.
enum RunStepKind {
  RUN_STEP_KIND_UNSPECIFIED = 0;
  // Warming up.
  RUN_STEP_KIND_WARM_UP = 1;
  // Running, e.g. an interval or a steady section.
  RUN_STEP_KIND_RUN = 2;
  // Easy running or walking between hard steps.
  RUN_STEP_KIND_RECOVERY = 3;
  // Standing still.
  RUN_STEP_KIND_REST = 4;
  // Cooling down.
  RUN_STEP_KIND_COOL_DOWN = 5;
}

// A step of a structured run. A step lasts duration_seconds or
// distance_meters, or until the lap button is pressed if neither is set.
message RunStep {
  // What the step is. Required.
  RunStepKind kind = 1;
  // How long the step lasts in seconds. 0 if it's a distance, or until the
  // lap button.
  int32 duration_seconds = 2;
  // How far the step goes in meters. 0 if it's a time, or until the lap
  // button.
  double distance_meters = 3;
  // The intensity to hold, if any.
  oneof target {
    // A heart rate range.
    HeartRateTarget heart_rate = 4;
    // A pace range.
    PaceTarget pace = 5;
  }
  // A short cue for the step, e.g. "Uphill, strong but relaxed". Empty if
  // none.
  string notes = 6;
}

// HeartRateReference is what a heart rate target's range is measured from.
enum HeartRateReference {
  // Beats per minute.
  HEART_RATE_REFERENCE_UNSPECIFIED = 0;
  // Beats per minute from the user's aerobic threshold, from their latest
  // lactate test that found it. See LactateTestService.
  HEART_RATE_REFERENCE_AEROBIC_THRESHOLD = 1;
  // Beats per minute from the user's anaerobic threshold, from their
  // latest lactate test that found it.
  HEART_RATE_REFERENCE_ANAEROBIC_THRESHOLD = 2;
}

// A heart rate range to hold. With a threshold reference, the range is
// relative to it and follows it as new lactate tests move it, e.g. -15 to 0
// for easy running below the aerobic threshold, or -5 to 3 for intervals at
// the anaerobic threshold.
message HeartRateTarget {
  // What low_bpm and high_bpm are measured from; unspecified for beats per
  // minute.
  HeartRateReference reference = 1;
  // The bottom of the range, in beats per minute, or from the threshold.
  int32 low_bpm = 2;
  // The top of the range, in beats per minute, or from the threshold. At
  // least low_bpm.
  int32 high_bpm = 3;
}

// A pace range to hold.
message PaceTarget {
  // The fastest pace, in seconds per kilometer, e.g. 270 for 4:30/km.
  int32 fast_seconds_per_kilometer = 1;
  // The slowest pace, in seconds per kilometer. At least
  // fast_seconds_per_kilometer.
  int32 slow_seconds_per_kilometer = 2;
}

// Cycling, swimming, skiing or other non-running cardio. The workout's title
// says which.
message CrossTrainingWorkout {
  // Target distance in meters. 0 if not set.
  double target_distance_meters = 1;
  // Target elevation gain in meters. 0 if not set.
  double target_elevation_gain_meters = 2;
  // Target moving time in seconds. 0 if not set.
  int32 target_duration_seconds = 3;
}

// A race, either a goal race or a tune-up. The race itself is managed with
// RaceService.
message RaceWorkout {
  // The race distance in meters. 0 if not set.
  double target_distance_meters = 1;
  // The race's elevation gain in meters. 0 if not set.
  double target_elevation_gain_meters = 2;
  // The goal finish time in seconds. 0 if not set.
  int32 target_duration_seconds = 3;
  // The ID of the route of the race course, if any. See RouteService.
  string route_id = 4;
}

// A rest day.
message RestDay {}

// Strength and mobility training. The user follows it on their phone in the
// web app: exercise by exercise, logging the reps of each set and how each
// exercise felt. That log is saved with the workout, and kept for each
// exercise's history (see ExerciseService.ListExerciseHistory), so use the
// logs of earlier workouts to choose the weights and reps of the next.
message StrengthWorkout {
  // The exercises in the order they are done. Maximum 40.
  repeated PlannedExercise exercises = 1;
  // How long the session takes in seconds, including rest. 0 if not set.
  int32 target_duration_seconds = 2;
  // What the user did, saved when they finish the workout with
  // SetStrengthLog. Unset until then. A workout with a log is complete.
  StrengthLog log = 3 [(mcp.v1.field).output_only = true];
  // The exercises the user lacks the equipment or the weights for at home,
  // see ExerciseService.GetHomeEquipment. Empty if they have everything, or
  // haven't said what they have. Change the exercises or weights so there
  // are none.
  repeated EquipmentIssue equipment_issues = 4 [(mcp.v1.field).output_only = true];
  // How the exercises of each group named in exercises' group are done:
  // straight sets, or back to back for rounds as a superset or circuit.
  // Every superset and circuit must be listed here, with its rounds and the
  // rest between rounds; a group that isn't listed is straight sets.
  repeated ExerciseGroup groups = 5;
}

// ExerciseGroupKind is how the exercises of a group are done.
enum ExerciseGroupKind {
  EXERCISE_GROUP_KIND_UNSPECIFIED = 0;
  // Each exercise for all its sets, resting after each set, before the
  // next exercise, e.g. a warm-up or the main lifts.
  EXERCISE_GROUP_KIND_STRAIGHT_SETS = 1;
  // Two or three exercises done back to back, one set of each, then
  // repeated for the group's rounds, e.g. split squats and single-leg
  // deadlifts.
  EXERCISE_GROUP_KIND_SUPERSET = 2;
  // Several exercises done back to back, one set of each, then repeated for
  // the group's rounds, e.g. a core circuit.
  EXERCISE_GROUP_KIND_CIRCUIT = 3;
  // Exercises that prepare for the workout, like leg swings, hip circles or
  // light bodyweight squats, each done for its sets like straight sets. They
  // aren't rated for effort, so leave their target_effort 0; the user says
  // how stiff they felt instead, see LoggedExercise.stiffness. Watches show
  // them as warm-up steps.
  EXERCISE_GROUP_KIND_WARM_UP = 4;
  // Exercises that wind down after the workout, like stretches, each done
  // for its sets like straight sets. Like a warm-up, they're rated for
  // stiffness rather than effort, and watches show them as cool-down steps.
  EXERCISE_GROUP_KIND_COOL_DOWN = 5;
}

// ExerciseGroup says how the exercises of a group of a strength workout are
// done. The exercises are those whose group is the group's name, and must
// be consecutive in the workout's exercises.
message ExerciseGroup {
  // The group's name, as in the exercises' group, e.g. "Superset A" or
  // "Core circuit". Required, and unique in the workout.
  string name = 1;
  // How the exercises are done. Required.
  ExerciseGroupKind kind = 2;
  // For a superset or circuit, how many times the whole sequence of
  // exercises is done, from 1 to 20. Required for them, and the only place
  // their rounds are kept. Unset for straight sets, whose exercises each
  // have their own sets.
  optional int32 rounds = 3;
  // For a superset or circuit, the rest after each round in seconds, e.g.
  // 60, or 0 for none. Unset for straight sets, whose exercises each have
  // their own rest.
  optional int32 rest_seconds = 4;
}

// Equipment an exercise of a strength workout needs that the user doesn't
// have at home.
message EquipmentIssue {
  // The index of the exercise in the workout's exercises.
  int32 exercise_index = 1;
  // The equipment the user lacks, or lacks the planned weight of.
  Equipment equipment = 2;
  // For a weight the user doesn't have, the closest weights of the
  // equipment they do have, lighter and heavier. Empty if they don't have
  // the equipment at all.
  repeated Weight closest_weights = 3;
  // What's missing, e.g. "Single-leg Romanian deadlift is planned with a
  // 14 kg kettlebell, and you have 12 kg and 16 kg ones".
  string description = 4;
}

// An exercise of a strength workout, with what to do: the sets, reps or
// hold time, weight and rest. The exercise itself (its instructions and
// muscles) is in the user's exercise library, see ExerciseService.
message PlannedExercise {
  // The ID of the exercise in the user's library. Required: create the
  // exercise with CreateExercises first.
  string exercise_id = 1;
  // The name of the exercise.
  string exercise_name = 2 [(mcp.v1.field).output_only = true];
  // The part of the workout the exercise is in, e.g. "Warm-up", "Main",
  // "Superset A" or "Cool-down". Consecutive exercises in the same group are
  // shown together. A group is straight sets unless StrengthWorkout.groups
  // says it's a superset or circuit. Empty if none.
  string group = 3;
  // The number of sets, from 1 to 20. In a superset or circuit, leave it 0,
  // as it reads: the exercise is done once each round, for the group's
  // rounds. A number other than the rounds is refused.
  int32 sets = 4;
  // The reps of each set, per side for exercises done on each side. 0 for
  // exercises held for a time, and for exercises done until the user is
  // done, like stretches or leg swings: leave both reps and hold_seconds 0
  // for those, and watches move on when the lap button is pressed.
  int32 reps = 5;
  // How long each set is held in seconds, per side for exercises done on
  // each side, e.g. 30 for a plank. 0 for exercises done for reps. Set at
  // most one of reps and hold_seconds: with neither, the exercise is done
  // until the user is done, e.g. leg swings in a warm-up or stretches in a
  // cool-down, and watches move on when they press the lap button.
  int32 hold_seconds = 6;
  // The weight of the exercise's dumbbells (each), kettlebell or medicine
  // ball, in the unit of the user's equipment, e.g. 25 pounds for 25 lb
  // dumbbells. Unset for bodyweight. Choose one the user has (see
  // ExerciseService.GetHomeEquipment): they use this weight rather than
  // picking one on the day.
  Weight weight = 7;
  // The rest after each set in seconds. 0 if none. In a superset or
  // circuit, the rest before the next exercise of the round, usually 0; it
  // must be 0 for the group's last exercise, as the group's rest_seconds
  // comes after the round.
  int32 rest_seconds = 8;
  // The tempo, e.g. "3 s down, 1 s pause". Empty if none.
  string tempo = 9;
  // How hard the last reps of each set should feel, from 1 (very easy) to
  // 10 (maximal). 0 if not set. Most strength work for runners is 6 to 8,
  // leaving two to four reps in reserve.
  int32 target_effort = 10;
  // Notes for this workout, e.g. "Slow and controlled on the way down".
  // Shown with the exercise's instructions and how it should feel. Empty if
  // none.
  string notes = 11;
}

// SessionEffort is how hard a whole strength session felt.
enum SessionEffort {
  SESSION_EFFORT_UNSPECIFIED = 0;
  SESSION_EFFORT_VERY_EASY = 1;
  SESSION_EFFORT_EASY = 2;
  SESSION_EFFORT_ABOUT_RIGHT = 3;
  SESSION_EFFORT_HARD = 4;
  SESSION_EFFORT_VERY_HARD = 5;
}

// ExerciseEffort is how hard an exercise felt compared to what was planned.
enum ExerciseEffort {
  EXERCISE_EFFORT_UNSPECIFIED = 0;
  // Easier than the planned effort: increase the weight or reps.
  EXERCISE_EFFORT_TOO_EASY = 1;
  EXERCISE_EFFORT_JUST_RIGHT = 2;
  // Harder than the planned effort: decrease the weight or reps.
  EXERCISE_EFFORT_TOO_HARD = 3;
}

// ExerciseVolume is how the number of reps or sets of an exercise felt.
enum ExerciseVolume {
  EXERCISE_VOLUME_UNSPECIFIED = 0;
  EXERCISE_VOLUME_TOO_FEW = 1;
  EXERCISE_VOLUME_ABOUT_RIGHT = 2;
  EXERCISE_VOLUME_TOO_MANY = 3;
}

// Stiffness is how stiff the body felt in a warm-up or cool-down exercise,
// which tracks recovery and niggles over time.
enum Stiffness {
  STIFFNESS_UNSPECIFIED = 0;
  // Moved freely.
  STIFFNESS_LOOSE = 1;
  // A bit stiff, easing as it went.
  STIFFNESS_A_BIT_STIFF = 2;
  // Stiff throughout.
  STIFFNESS_STIFF = 3;
  // Sore or painful somewhere; the notes say where.
  STIFFNESS_SORE = 4;
}

// What the user did in a strength workout, and how it felt.
message StrengthLog {
  // When the workout was completed: when the log was first saved.
  google.protobuf.Timestamp complete_time = 1 [(mcp.v1.field).output_only = true];
  // How hard the whole session felt. Unspecified if not rated.
  SessionEffort effort = 2;
  // Notes on the session, e.g. "Left knee felt the step-downs". Empty if
  // none.
  string notes = 3;
  // The exercises done, in order. Maximum 40.
  repeated LoggedExercise exercises = 4;
}

// An exercise as it was done.
message LoggedExercise {
  // The ID of the exercise in the user's library. Required.
  string exercise_id = 1;
  // The name of the exercise.
  string exercise_name = 2 [(mcp.v1.field).output_only = true];
  // The sets done, in order. Sets that were skipped are left out. Maximum
  // 20.
  repeated LoggedSet sets = 3;
  // How hard the exercise felt compared to the plan, overall. Unspecified
  // if not rated, and for warm-up and cool-down exercises, which are rated
  // by stiffness instead. The web app rates each set instead, see
  // LoggedSet.effort, as sets can feel different; this is set in older
  // logs.
  ExerciseEffort effort = 4;
  // How the number of reps felt. Unspecified if not rated, and for warm-up
  // and cool-down exercises.
  ExerciseVolume volume = 5;
  // Notes on the exercise, e.g. "Last set wobbly on the left leg". Empty if
  // none.
  string notes = 6;
  // How stiff the body felt, overall, for warm-up and cool-down exercises.
  // Unspecified if not rated. The web app rates each set instead, see
  // LoggedSet.stiffness.
  Stiffness stiffness = 7;
}

// A set as it was done.
message LoggedSet {
  // The reps done, per side for exercises done on each side. 0 for
  // exercises held for a time.
  int32 reps = 1;
  // How long the set was held in seconds. 0 for exercises done for reps.
  int32 hold_seconds = 2;
  // The weight used, as in PlannedExercise. Unset for bodyweight.
  Weight weight = 3;
  // How hard the set felt compared to the plan, e.g. the first too easy and
  // the last too hard. Unspecified if not rated, and for warm-up and
  // cool-down exercises. Use it with the reps and weight to choose the next
  // workout's.
  ExerciseEffort effort = 4;
  // How stiff the body felt in the set, for warm-up and cool-down
  // exercises. Unspecified if not rated.
  Stiffness stiffness = 5;
}

message CreateTrainingPlanRequest {
  // The plan to create.
  TrainingPlan plan = 1;
}

message CreateTrainingPlanResponse {
  // The created plan.
  TrainingPlan plan = 1;
}

message GetTrainingPlanRequest {
  // The ID of the plan.
  string id = 1;
}

message GetTrainingPlanResponse {
  // The plan.
  TrainingPlan plan = 1;
  // The plan's month and week periods in date order.
  repeated PlanPeriod periods = 2;
}

message ListTrainingPlansRequest {}

message ListTrainingPlansResponse {
  // The user's plans.
  repeated TrainingPlan plans = 1;
}

message UpdateTrainingPlanRequest {
  // The plan to update. The ID must be set.
  TrainingPlan plan = 1;
  // The fields to update, e.g. "name,description". If empty, all fields are
  // replaced.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateTrainingPlanResponse {
  // The updated plan.
  TrainingPlan plan = 1;
}

message DeleteTrainingPlanRequest {
  // The ID of the plan to delete.
  string id = 1;
}

message DeleteTrainingPlanResponse {}

message SetPlanPeriodsRequest {
  // The ID of the plan.
  string plan_id = 1;
  // The periods to create or replace.
  repeated PlanPeriod periods = 2;
}

message SetPlanPeriodsResponse {
  // The created or replaced periods.
  repeated PlanPeriod periods = 1;
}

message DeletePlanPeriodsRequest {
  // The ID of the plan.
  string plan_id = 1;
  // The IDs of the periods to delete. Leave empty to delete the periods
  // matching granularity, start_date and end_date instead.
  repeated string ids = 2;
  // Delete only the periods of this granularity, all if unspecified. Can't
  // be combined with ids.
  PeriodGranularity granularity = 3;
  // Delete only the periods starting on or after this date (YYYY-MM-DD). Can't
  // be combined with ids.
  string start_date = 4;
  // Delete only the periods starting on or before this date (YYYY-MM-DD).
  // Can't be combined with ids.
  string end_date = 5;
}

message DeletePlanPeriodsResponse {
  // How many periods were deleted.
  int32 deleted_count = 1;
}

message ListWorkoutsRequest {
  // The ID of the plan. If empty, the workouts of all the user's plans are
  // listed.
  string plan_id = 1;
  // Only include workouts on or after this date (YYYY-MM-DD).
  string start_date = 2;
  // Only include workouts on or before this date (YYYY-MM-DD).
  string end_date = 3;
}

message ListWorkoutsResponse {
  // The workouts in date order, each day's by start time, those without one
  // last.
  repeated Workout workouts = 1;
}

message GetWorkoutRequest {
  // The ID of the workout.
  string id = 1;
}

message GetWorkoutResponse {
  // The workout.
  Workout workout = 1;
}

// WeatherLocationSource is where a workout's forecast is for.
enum WeatherLocationSource {
  WEATHER_LOCATION_SOURCE_UNSPECIFIED = 0;
  // The workout's location.
  WEATHER_LOCATION_SOURCE_WORKOUT_LOCATION = 3;
  // The start of the workout's route.
  WEATHER_LOCATION_SOURCE_ROUTE_START = 1;
  // Where the user's most recent activity started, for workouts without a
  // location or route.
  WEATHER_LOCATION_SOURCE_LATEST_ACTIVITY = 2;
}

// The weather forecast for the day of a workout.
message WorkoutWeather {
  // The ID of the workout.
  string workout_id = 1;
  // The date of the workout (YYYY-MM-DD).
  string date = 2;
  // Where the forecast is for.
  geo.v1.LatLng location = 3;
  // Where the location comes from.
  WeatherLocationSource location_source = 4;
  // The weather during the daytime, from 06:00 to 21:00 local time.
  DayWeather day = 5;
  // The forecast for each hour of the daytime, and of the workout if it's
  // outside it. Only set by GetWorkoutWeather.
  repeated HourWeather hours = 6;
  // The weather during the workout: from the start of its start window to
  // the end of the window plus the workout's target duration, or an hour if
  // it has none. Unset for workouts without a start time.
  DayWeather workout = 7;
  // When that period starts and ends.
  google.protobuf.Timestamp workout_start_time = 8;
  google.protobuf.Timestamp workout_end_time = 9;
}

// The weather of a day.
message DayWeather {
  // The lowest and highest air temperature in degrees Celsius.
  double min_temperature_celsius = 1;
  double max_temperature_celsius = 2;
  // The highest chance of precipitation in percent.
  int32 max_precipitation_probability = 3;
  // The total precipitation in millimeters.
  double precipitation_mm = 4;
  // The total snowfall in centimeters.
  double snowfall_cm = 5;
  // The strongest wind and gusts in kilometers per hour.
  double max_wind_speed_kmh = 6;
  double max_wind_gusts_kmh = 7;
  // The most severe WMO weather code of the day, as used by Open-Meteo.
  int32 weather_code = 8;
  // A description of the weather code, e.g. "Light rain".
  string description = 9;
}

// The weather forecast for an hour.
message HourWeather {
  // The start of the hour.
  google.protobuf.Timestamp time = 1;
  // Air temperature in degrees Celsius.
  double temperature_celsius = 2;
  // Apparent (feels like) temperature in degrees Celsius.
  double apparent_temperature_celsius = 3;
  // The chance of precipitation in percent.
  int32 precipitation_probability = 4;
  // Precipitation in millimeters.
  double precipitation_mm = 5;
  // The WMO weather code, as used by Open-Meteo.
  int32 weather_code = 6;
  // Wind and gusts in kilometers per hour, and where the wind comes from in
  // degrees.
  double wind_speed_kmh = 7;
  double wind_gusts_kmh = 8;
  int32 wind_direction_degrees = 9;
  // Whether it is daylight.
  bool is_day = 10;
}

message ListWorkoutWeatherRequest {
  // The first and last date of the range (YYYY-MM-DD).
  string start_date = 1;
  string end_date = 2;
}

message ListWorkoutWeatherResponse {
  // The forecasts of the workouts that have one, in date order.
  repeated WorkoutWeather weather = 1;
}

message GetWorkoutWeatherRequest {
  // The ID of the workout.
  string workout_id = 1;
}

message GetWorkoutWeatherResponse {
  // The forecast. Unset if there is none, e.g. for workouts more than 15
  // days ahead, without a location, or for rest days and strength training.
  WorkoutWeather weather = 1;
}

message CreateWorkoutsRequest {
  // The ID of the plan.
  string plan_id = 1;
  // The workouts to create. Each date must be within the plan. Maximum 400.
  repeated Workout workouts = 2;
}

message CreateWorkoutsResponse {
  // The created workouts.
  repeated Workout workouts = 1;
}

message UpdateWorkoutRequest {
  // The workout to update. The ID must be set.
  Workout workout = 1;
  // The fields to update, e.g. "title,strength". The kind of workout is
  // updated as a whole: "run" replaces the run's targets and route, and
  // "strength" its exercises, keeping its log. If empty, all fields are
  // replaced.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateWorkoutResponse {
  // The updated workout.
  Workout workout = 1;
}

message DeleteWorkoutsRequest {
  // The ID of the plan.
  string plan_id = 1;
  // The IDs of the workouts to delete.
  repeated string ids = 2;
}

message DeleteWorkoutsResponse {}

message SetStrengthLogRequest {
