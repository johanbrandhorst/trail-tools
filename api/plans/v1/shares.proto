syntax = "proto3";

package plans.v1;

import "mcp/v1/options.proto";
import "plans/v1/exercises.proto";
import "plans/v1/plans.proto";
import "routes/v1/routes.proto";

// WorkoutShareService shares workouts read-only with people who don't have
// an account, like a friend joining a run. Anyone with a workout's share
// link can view it, with its route and exercises, and download the route as
// GPX and as a course for their watch, and a strength workout for their
// watch, without signing in. Nothing else of the user's is shared, and
// unsharing stops the link working.
service WorkoutShareService {
  // Create a share link for a workout, or return its existing one.
  rpc ShareWorkout(ShareWorkoutRequest) returns (ShareWorkoutResponse);
  // Stop sharing a workout: its share link stops working. Sharing it again
  // creates a new link.
  rpc UnshareWorkout(UnshareWorkoutRequest) returns (UnshareWorkoutResponse);
  // Get a shared workout by the token of its share link. Doesn't require
  // signing in.
  rpc GetSharedWorkout(GetSharedWorkoutRequest) returns (GetSharedWorkoutResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Get the user's calendar feed: an iCalendar URL of their upcoming
  // workouts, for calendar apps and home automation to subscribe to. Its URL
  // is a secret, so it's only shown in the web app.
  rpc GetCalendarFeed(GetCalendarFeedRequest) returns (GetCalendarFeedResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Create the user's calendar feed, or replace it with a new URL, so the
  // old one stops working.
  rpc CreateCalendarFeed(CreateCalendarFeedRequest) returns (CreateCalendarFeedResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Delete the user's calendar feed: its URL stops working.
  rpc DeleteCalendarFeed(DeleteCalendarFeedRequest) returns (DeleteCalendarFeedResponse) {
    option (mcp.v1.method).exclude = true;
  }
}

// A calendar feed of the user's workouts, in iCalendar format, from a week
// ago to four weeks ahead, for calendar apps: an event for each workout but
// rest days, at its start time for its target duration (or its start window
// without one), or all day without a start time. Done workouts stay, marked
// "✓". Each event's description is the workout's, with its link. Times are
// in the time zone of the user's latest activity.
//
// Home automation, like Home Assistant, adds the query parameter
// format=home-assistant: then the feed only has the workouts from yesterday
// on that aren't done and have a start time and a target duration, and each
// description's first line is "latest_end: HH:MM", the local time the
// workout ends if started at the end of its start window.
message CalendarFeed {
  // The feed's URL, with its secret in the path, for apps that can only
  // subscribe to a URL.
  string url = 1;
  // The same feed with its secret as HTTP Basic auth instead, which keeps
  // it out of server logs, for apps that support it.
  string basic_auth_url = 2;
}

message GetCalendarFeedRequest {}

message GetCalendarFeedResponse {
  // The feed. Unset if the user has none.
  CalendarFeed feed = 1;
}

message CreateCalendarFeedRequest {}

message CreateCalendarFeedResponse {
  // The new feed.
  CalendarFeed feed = 1;
}

message DeleteCalendarFeedRequest {}

message DeleteCalendarFeedResponse {}

message ShareWorkoutRequest {
  // The ID of the workout.
  string id = 1;
}

message ShareWorkoutResponse {
  // The link anyone can view the workout with.
  string share_url = 1;
}

message UnshareWorkoutRequest {
  // The ID of the workout.
  string id = 1;
}

message UnshareWorkoutResponse {}

message GetSharedWorkoutRequest {
  // The token from the share link.
  string token = 1;
}

// The route of a shared workout.
message SharedRoute {
  // The route's name.
  string name = 1;
  // The route's statistics.
  routes.v1.RouteStats stats = 2;
  // The path, downsampled for display.
  repeated routes.v1.RoutePoint points = 3;
}

message GetSharedWorkoutResponse {
  // The workout, without what's the owner's own: its plan, the activity
  // that completed it and its strength log.
  Workout workout = 1;
  // The route of a run or race, if it has one.
  SharedRoute route = 2;
  // The exercises of a strength workout, from the owner's library, with
  // how to do them and their animations.
  repeated Exercise exercises = 3;
}
