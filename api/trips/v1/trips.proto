syntax = "proto3";

package trips.v1;

import "geo/v1/geo.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/image.proto";
import "mcp/v1/options.proto";
import "routes/v1/routes.proto";

// TripReportService writes trip reports: blog style stories of a run, hike or
// other adventure, made from a recorded activity, with photos placed along
// the activity's track.
//
// A report starts as a private draft. Creating a report from an activity
// copies the activity's name, date, statistics and GPS track into it, so the
// report keeps them even if the activity changes. The story is told in
// sections, like the chapters of a blog post: each has a heading, plain text
// (paragraphs separated by blank lines) and photos, and is usually about a
// stretch of the track, e.g. the first climb or a ridge. The app can suggest
// sections from the track's elevation profile. The author uploads photos in
// the app; each photo is placed on the map at the time it was taken along the
// activity's track, or else from its GPS position, and goes in the section
// about where it was taken.
//
// Publishing makes a report public at <public URL>/u/<handle>/<slug>, where
// it can be read without signing in and indexed by search engines, and lists
// it on the author's public page at <public URL>/u/<handle>. Publishing
// requires a public profile with a handle, and is done by the author in the
// app. Help the author by drafting and editing the title, the sections and
// their text, and captions of photos.
service TripReportService {
  // Create a draft trip report with one section. With an activity, the
  // report's title, date, statistics and track are copied from the activity,
  // its description becomes the section's text, and its photos are imported
  // from Strava.
  rpc CreateTripReport(CreateTripReportRequest) returns (CreateTripReportResponse);
  // Get one of the user's trip reports with its sections and photos, and
  // optionally its track.
  rpc GetTripReport(GetTripReportRequest) returns (GetTripReportResponse);
  // List the user's trip reports, drafts and published, most recent trip
  // first.
  rpc ListTripReports(ListTripReportsRequest) returns (ListTripReportsResponse);
  // Update the title, slug, date or cover photo of a trip report. The slug of a
  // published report can't be changed, so that its URL stays stable. The
  // story is changed with SetTripSections.
  rpc UpdateTripReport(UpdateTripReportRequest) returns (UpdateTripReportResponse);
  // Delete a trip report and its photos.
  rpc DeleteTripReport(DeleteTripReportRequest) returns (DeleteTripReportResponse);
  // Publish a trip report, making it public. Requires a public profile.
  rpc PublishTripReport(PublishTripReportRequest) returns (PublishTripReportResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Unpublish a trip report, making it a private draft again.
  rpc UnpublishTripReport(UnpublishTripReportRequest) returns (UnpublishTripReportResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Upload a photo to a trip report. The image is stored as a JPEG of at most
  // 2048 pixels and a thumbnail, without its metadata. It's placed on the
  // track at the time it was taken, if that was during the activity, or else
  // at its GPS position.
  rpc UploadTripPhoto(UploadTripPhotoRequest) returns (UploadTripPhotoResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Import the photos of the report's activity from Strava that it doesn't
  // have yet, e.g. ones added on Strava after the report was created, like
  // uploaded photos and with their captions. Photos imported before are
  // skipped.
  rpc ImportStravaPhotos(ImportStravaPhotosRequest) returns (ImportStravaPhotosResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Update the caption or the location of a photo.
  rpc UpdateTripPhoto(UpdateTripPhotoRequest) returns (UpdateTripPhotoResponse);
  // Set the sections of a trip report's story, in order, replacing its
  // sections: their headings, text, stretches of the track, and photos.
  // Sections with an ID are updated, sections without one are created, and
  // the report's other sections are deleted. Moving photos between sections
  // or reordering them is done by listing them in their new section and
  // order. To change one section, get the report and send all its sections
  // back with the change.
  rpc SetTripSections(SetTripSectionsRequest) returns (SetTripSectionsResponse);
  // Suggest sections for a trip report from its track's elevation profile:
  // the climbs, descents, and rolling or flat stretches in between, named
  // e.g. "Climb to 1,450 m" or "Rolling ridge, 6 km", with the report's
  // photos in the section about where they were taken. Nothing is saved;
  // pass the sections to SetTripSections, with text, to use them. Requires
  // a track with elevations.
  rpc SuggestTripSections(SuggestTripSectionsRequest) returns (SuggestTripSectionsResponse);
  // Delete a photo.
  rpc DeleteTripPhoto(DeleteTripPhotoRequest) returns (DeleteTripPhotoResponse);
  // Get a photo of one of the user's trip reports with its image, to look at
  // it, e.g. to write its caption or the story around it. The thumbnail is
  // enough to see what's in a photo; get the large image for details.
  rpc GetTripPhoto(GetTripPhotoRequest) returns (GetTripPhotoResponse);
  // Get the user's public profile. The profile is unset if the user hasn't
  // created one yet.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // Create or update the user's public profile. Changing the handle changes
  // the URLs of all published reports.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Get a public profile and its published trip reports. Does not require
  // authentication.
  rpc GetPublicProfile(GetPublicProfileRequest) returns (GetPublicProfileResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Get a published trip report by its author's handle and its slug. Does
  // not require authentication. Authors can also preview their drafts.
  rpc GetPublicTripReport(GetPublicTripReportRequest) returns (GetPublicTripReportResponse) {
    option (mcp.v1.method).exclude = true;
  }
}

// A trip report.
message TripReport {
  // The ID of the report.
  string id = 1 [(mcp.v1.field).output_only = true];
  // The ID of the activity the report was made from, if any. Empty if it was
  // made without one, or the activity was deleted.
  string activity_id = 2 [(mcp.v1.field).output_only = true];
  // The title.
  string title = 3;
  // The last part of the report's URL: lowercase letters, digits and dashes,
  // unique among the author's reports. Defaults to the title.
  string slug = 4;
  reserved 5;
  reserved "body";
  // The local date of the trip (YYYY-MM-DD).
  string date = 6;
  // The statistics of the trip, copied from the activity.
  TripStats stats = 7 [(mcp.v1.field).output_only = true];
  // Whether the report is published.
  bool published = 8 [(mcp.v1.field).output_only = true];
  // When the report was first published.
  google.protobuf.Timestamp publish_time = 9 [(mcp.v1.field).output_only = true];
  // The public URL of the report, if the author has a public profile. Only
  // reachable by others once published.
  string url = 10 [(mcp.v1.field).output_only = true];
  // The photos in the order of the story: by section, and in order within
  // each section. Lists of reports only include the cover photo; get a
  // report for all of them.
  repeated TripPhoto photos = 11 [(mcp.v1.field).output_only = true];
  // When the report was created.
  google.protobuf.Timestamp create_time = 12 [(mcp.v1.field).output_only = true];
  // When the report was last updated.
  google.protobuf.Timestamp update_time = 13 [(mcp.v1.field).output_only = true];
  // Whether the report has a GPS track.
  bool has_track = 14 [(mcp.v1.field).output_only = true];
  // The track's ends were hidden by a radius here, replaced by the author's
  // privacy zones, see UserService.
  reserved 15;
  reserved "hidden_ends_meters";
  // The sections of the story in order. Not set in lists of reports.
  repeated TripSection sections = 16 [(mcp.v1.field).output_only = true];
  // The start of the story, for lists of reports.
  string excerpt = 17 [(mcp.v1.field).output_only = true];
  // The ID of the photo shown on top of the report, in lists of reports and
  // in link previews: the one chosen, or the first photo if none was
  // chosen. Empty for a report without photos.
  string cover_photo_id = 18 [(mcp.v1.field).output_only = true];
  // The tags, for readers to find reports, in the order of TripTag.
  repeated TripTag tags = 19;
}

// TripTag is a tag of a trip report.
enum TripTag {
  TRIP_TAG_UNSPECIFIED = 0;
  // Good for beginners. A report has at most one of the difficulty tags:
  // beginner friendly, moderate and challenging.
  TRIP_TAG_BEGINNER_FRIENDLY = 1;
  // Moderate difficulty.
  TRIP_TAG_MODERATE = 2;
  // Challenging.
  TRIP_TAG_CHALLENGING = 3;
  // Mostly runnable terrain.
  TRIP_TAG_RUNNABLE = 4;
  // Technical terrain, e.g. roots, rocks or steep descents.
  TRIP_TAG_TECHNICAL = 5;
  // Scrambling, using hands.
  TRIP_TAG_SCRAMBLING = 6;
  // Snow on the route.
  TRIP_TAG_SNOW = 7;
  // A loop. A report has at most one of the route shape tags: loop, out and
  // back, and point to point.
  TRIP_TAG_LOOP = 8;
  // Out and back.
  TRIP_TAG_OUT_AND_BACK = 9;
  // Point to point.
  TRIP_TAG_POINT_TO_POINT = 10;
}

// TripTags is a list of tags, to set them.
message TripTags {
  // The tags.
  repeated TripTag tags = 1;
}

// A section of a trip report's story, like a chapter of a blog post.
message TripSection {
  // The ID of the section. Empty for a new section.
  string id = 1;
  // The heading, e.g. "Climb to 1,450 m". Empty for a section without a
  // heading, e.g. an introduction.
  string title = 2;
  // The text as plain text. Paragraphs are separated by blank lines.
  string body = 3;
  // Where the stretch of the track the section is about starts and ends, in
  // meters along the track. Both are unset for a section that isn't about a
  // stretch, e.g. an introduction.
  optional double start_distance_meters = 4;
  optional double end_distance_meters = 5;
  // The IDs of the section's photos, in order.
  repeated string photo_ids = 6;
}

// The statistics of a trip.
message TripStats {
  // The Strava sport type, e.g. Run, TrailRun, Hike.
  string sport_type = 1;
  // When the activity started, if known.
  google.protobuf.Timestamp start_time = 2;
  // The IANA timezone of the trip, e.g. Europe/Zurich.
  string timezone = 3;
  // Distance in meters.
  double distance_meters = 4;
  // Moving time in seconds.
  int32 moving_time_seconds = 5;
  // Elapsed time in seconds.
  int32 elapsed_time_seconds = 6;
  // Total elevation gain in meters.
  double elevation_gain_meters = 7;
}

// LocationSource is where the location of a photo comes from.
enum LocationSource {
  // The photo has no location.
  LOCATION_SOURCE_UNSPECIFIED = 0;
  // The GPS position recorded in the photo.
  LOCATION_SOURCE_GPS = 1;
  // The position on the track at the time the photo was taken.
  LOCATION_SOURCE_TRACK_TIME = 2;
  // Placed on the map by the author.
  LOCATION_SOURCE_MANUAL = 3;
}

// A photo of a trip report.
message TripPhoto {
  // The ID of the photo.
  string id = 1 [(mcp.v1.field).output_only = true];
  // The caption.
  string caption = 2;
  // Where the photo was taken. Unset if unknown.
  geo.v1.LatLng location = 3;
  // Where the location comes from.
  LocationSource location_source = 4 [(mcp.v1.field).output_only = true];
  // The distance along the track of the point nearest to the location, in
  // meters. Unset if the photo has no location or the report has no track.
  optional double track_distance_meters = 5 [(mcp.v1.field).output_only = true];
  // When the photo was taken, if known.
  google.protobuf.Timestamp taken_time = 6 [(mcp.v1.field).output_only = true];
  // The width of the image in pixels.
  int32 width = 7 [(mcp.v1.field).output_only = true];
  // The height of the image in pixels.
  int32 height = 8 [(mcp.v1.field).output_only = true];
  // The URL of the image, at most 2048 pixels on the long side.
  string url = 9 [(mcp.v1.field).output_only = true];
  // The URL of a thumbnail, at most 480 pixels on the long side.
  string thumbnail_url = 10 [(mcp.v1.field).output_only = true];
}

// A public profile, under which published trip reports are listed.
message Profile {
  // The handle in the profile's URL: 3 to 30 lowercase letters, digits and
  // dashes, starting and ending with a letter or digit.
  string handle = 1;
  // The name shown on the profile and reports.
  string display_name = 2;
  // The public URL of the profile.
  string url = 3 [(mcp.v1.field).output_only = true];
}

message CreateTripReportRequest {
  // The ID of the activity to make the report from. Optional.
  string activity_id = 1;
  // The title. Defaults to the activity's name; required without an
  // activity.
  string title = 2;
}

message CreateTripReportResponse {
  // The created draft.
  TripReport report = 1;
}

message GetTripReportRequest {
  // The ID of the report.
  string id = 1;
  // Include the track.
  bool include_track = 2;
}

message GetTripReportResponse {
  // The report.
  TripReport report = 1;
  // The track, if requested and the report has one.
  repeated routes.v1.RoutePoint track = 2;
}

message ListTripReportsRequest {
  // Only list the reports made from this activity.
  string activity_id = 1;
}

message ListTripReportsResponse {
  // The reports, most recent trip first.
  repeated TripReport reports = 1;
}

message UpdateTripReportRequest {
  // The ID of the report.
  string id = 1;
  // The new title, if set.
  optional string title = 2;
  // The new slug, if set. Can't be changed while published.
  optional string slug = 3;
  reserved 4;
  reserved "body";
  // The new date (YYYY-MM-DD), if set.
  optional string date = 5;
  reserved 6;
  reserved "hidden_ends_meters";
  // The ID of the photo to show on top of the report, in lists of reports
  // and in link previews, if set: one of the report's photos, or empty to
  // use the first photo.
  optional string cover_photo_id = 7;
  // The new tags, if set. A report has at most one difficulty tag and one
  // route shape tag.
  TripTags tags = 8;
}

message UpdateTripReportResponse {
  // The updated report.
  TripReport report = 1;
}

message DeleteTripReportRequest {
  // The ID of the report.
  string id = 1;
}

message DeleteTripReportResponse {}

message PublishTripReportRequest {
  // The ID of the report.
  string id = 1;
}

message PublishTripReportResponse {
  // The published report.
  TripReport report = 1;
}

message UnpublishTripReportRequest {
  // The ID of the report.
  string id = 1;
}

message UnpublishTripReportResponse {
  // The unpublished report.
  TripReport report = 1;
}

message UploadTripPhotoRequest {
  // The ID of the report.
  string report_id = 1;
  // The image, as a JPEG, PNG or WebP file.
  bytes data = 2;
  // The caption.
  string caption = 3;
  // The GPS position recorded in the photo, if any.
  geo.v1.LatLng location = 4;
  // When the photo was taken, if the time and its UTC offset are known.
  google.protobuf.Timestamp taken_time = 5;
  // When the photo was taken as a local time without an offset
  // (YYYY-MM-DDTHH:MM:SS), as recorded by most cameras. It is interpreted in
  // the timezone of the trip. Ignored if taken_time is set.
  string taken_local_time = 6;
}

message UploadTripPhotoResponse {
  // The uploaded photo.
  TripPhoto photo = 1;
}

message ImportStravaPhotosRequest {
  // The ID of the report. It must have been made from an activity.
  string report_id = 1;
}

message ImportStravaPhotosResponse {
  // The imported photos.
  repeated TripPhoto photos = 1;
  // The number of the activity's photos that were imported before.
  int32 skipped_count = 2;
  // The number of photos that couldn't be downloaded from Strava.
  int32 failed_count = 3;
}

message UpdateTripPhotoRequest {
  // The ID of the photo.
  string id = 1;
  // The new caption, if set.
  optional string caption = 2;
  // The new location, if set. The location is then manual.
  geo.v1.LatLng location = 3;
  // Remove the location.
  bool clear_location = 4;
}

message UpdateTripPhotoResponse {
  // The updated photo.
  TripPhoto photo = 1;
}

message SetTripSectionsRequest {
  // The ID of the report.
  string report_id = 1;
  // The sections in order, at least one. Photos that aren't listed stay in
  // their section, or move to the first section if theirs is deleted.
  repeated TripSection sections = 2;
}

message SetTripSectionsResponse {
  // The updated report.
  TripReport report = 1;
}

message SuggestTripSectionsRequest {
  // The ID of the report.
  string report_id = 1;
}

message SuggestTripSectionsResponse {
  // The suggested sections in order, without IDs or text.
  repeated TripSection sections = 1;
}

// The size of a photo's image.
enum PhotoSize {
  // The thumbnail.
  PHOTO_SIZE_UNSPECIFIED = 0;
  // At most 480 pixels wide and high: tens of kilobytes.
  PHOTO_SIZE_THUMBNAIL = 1;
  // At most 2048 pixels wide and high: hundreds of kilobytes.
  PHOTO_SIZE_LARGE = 2;
}

message GetTripPhotoRequest {
  // The ID of the photo.
  string id = 1;
  // The size of the image. Defaults to the thumbnail.
  PhotoSize size = 2;
}

message GetTripPhotoResponse {
  // The photo.
  TripPhoto photo = 1;
  // The photo's image, a JPEG.
  mcp.v1.Image image = 2;
}

message DeleteTripPhotoRequest {
  // The ID of the photo.
  string id = 1;
}

message DeleteTripPhotoResponse {}

message GetProfileRequest {}

message GetProfileResponse {
  // The profile, unset if the user has none.
  Profile profile = 1;
  // A suggested display name for a new profile.
  string suggested_display_name = 2;
}

message UpdateProfileRequest {
  // The profile.
  Profile profile = 1;
}

message UpdateProfileResponse {
  // The updated profile.
  Profile profile = 1;
}

message GetPublicProfileRequest {
  // The handle of the profile.
  string handle = 1;
}

message GetPublicProfileResponse {
  // The profile.
  Profile profile = 1;
  // The published trip reports, most recent trip first.
  repeated TripReport reports = 2;
}

message GetPublicTripReportRequest {
  // The handle of the author.
  string handle = 1;
  // The slug of the report.
  string slug = 2;
}

message GetPublicTripReportResponse {
  // The report.
  TripReport report = 1;
  // The author.
  Profile author = 2;
  // The track, if the report has one, without the stretches in the
  // author's privacy zones. Its distances are along the whole track.
  repeated routes.v1.RoutePoint track = 3;
  // The indexes of the track's points that start a new piece of it, after a
  // stretch hidden in a privacy zone. Don't join them to the point before.
  repeated int32 track_breaks = 4;
}
