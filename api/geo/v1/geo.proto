syntax = "proto3";

package geo.v1;

import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// GeoService provides tools for exploring the area around a location. Map data
// comes from OpenStreetMap, elevation data from the Copernicus DEM (via
// Open-Meteo), and the heatmap from the user's own synced activities. Use these
// tools to find trails, peaks, water sources and the user's familiar areas
// before designing a route with the RouteService.
service GeoService {
  // Geocode a free text query (e.g. "Mount Tamalpais", "Chamonix" or
  // "Marin Headlands trailhead") into candidate places with coordinates.
  rpc SearchPlaces(SearchPlacesRequest) returns (SearchPlacesResponse);
  // Find footpaths, tracks and trails within a radius of a point. Results are
  // OpenStreetMap ways with their name, type, surface and difficulty, sorted by
  // length, longest first. Only areas whose map data has been imported can be
  // searched, the same areas routes can be routed in; elsewhere this fails
  // with FAILED_PRECONDITION.
  rpc FindTrails(FindTrailsRequest) returns (FindTrailsResponse);
  // Find points of interest useful for trail running, such as peaks, water
  // sources, parking, viewpoints and shelters, within a radius of a point.
  // Only areas whose map data has been imported can be searched; elsewhere
  // this fails with FAILED_PRECONDITION.
  rpc FindPointsOfInterest(FindPointsOfInterestRequest) returns (FindPointsOfInterestResponse);
  // Look up the ground elevation of up to 100 points. The points must lie
  // within 16 one degree squares of latitude and longitude, such as along a
  // route; look up points further apart in separate requests.
  rpc GetElevation(GetElevationRequest) returns (GetElevationResponse);
  // Aggregate the user's own GPS tracks from synced activities into a grid of
  // cells inside a bounding box. Cells with a high count are places the user
  // runs often. Useful for finding familiar trails and areas.
  rpc GetPersonalHeatmap(GetPersonalHeatmapRequest) returns (GetPersonalHeatmapResponse);
  // List the trails and roads the user has run in a bounding box, the most
  // run first, by matching their GPS tracks to the mapped ways. Unlike the
  // heatmap's cells, these are the ways routes are built on: use them to
  // find the user's favorite trails, and to route along them with the
  // HEATMAP or TRAIL profile. Only areas whose map data has been imported
  // can be searched.
  rpc ListFamiliarTrails(ListFamiliarTrailsRequest) returns (ListFamiliarTrailsResponse);
  // Get the current avalanche forecast for a point, from Avalanche Canada,
  // which also publishes the forecasts of Parks Canada, Kananaskis Country
  // and Avalanche Québec. Forecasts only cover Canada's mountains, and only
  // in winter: elsewhere, or in summer, there is none. Check it before ski
  // tours and winter routes in avalanche terrain, tell the user the danger
  // and problems for their day, credit the forecaster and link to the full
  // forecast, which says more than this summary.
  rpc GetAvalancheForecast(GetAvalancheForecastRequest) returns (GetAvalancheForecastResponse);
  // List the parts of the user's GPS tracks inside a bounding box, simplified,
  // for drawing them as a heatmap.
  rpc ListHeatmapTracks(ListHeatmapTracksRequest) returns (ListHeatmapTracksResponse) {
    option (mcp.v1.method).exclude = true;
  }
}

// A WGS84 coordinate.
message LatLng {
  // Latitude in decimal degrees.
  double lat = 1;
  // Longitude in decimal degrees.
  double lng = 2;
}

// A rectangular area on the map.
message BoundingBox {
  // Southern edge latitude in decimal degrees.
  double south = 1;
  // Western edge longitude in decimal degrees.
  double west = 2;
  // Northern edge latitude in decimal degrees.
  double north = 3;
  // Eastern edge longitude in decimal degrees.
  double east = 4;
}

message SearchPlacesRequest {
  // Free text search query.
  string query = 1;
  // Maximum number of results. Defaults to 5, maximum 20.
  int32 limit = 2;
}

// A place found by a search.
message Place {
  // The full display name of the place.
  string name = 1;
  // The location of the place.
  LatLng location = 2;
  // The OpenStreetMap category of the place, e.g. "natural" or "highway".
  string category = 3;
  // The OpenStreetMap type of the place, e.g. "peak" or "trailhead".
  string type = 4;
  // The extent of the place, if known.
  BoundingBox bounds = 5;
}

message SearchPlacesResponse {
  // The places found, most relevant first.
  repeated Place places = 1;
}

message FindTrailsRequest {
  // The center of the search area.
  LatLng center = 1;
  // The search radius in meters. Defaults to 3000, maximum 15000.
  double radius_meters = 2;
  // Maximum number of trails to return, those nearest the center, longest
  // first. Defaults to 50, maximum 500.
  int32 limit = 3;
  // Include the geometry of each trail. Increases the response size
  // significantly; leave unset unless the coordinates are needed.
  bool include_geometry = 4;
  // How far in meters the returned geometry may stray from the trails, to
  // make the response smaller, e.g. the size of a pixel when drawing them on
  // a map. Defaults to 0, the full geometry.
  double geometry_tolerance_meters = 5;
}

// A trail is a single OpenStreetMap way, such as a path or track. A way that's
// only partly imported is returned as a trail for each part.
message Trail {
  // The OpenStreetMap way ID.
  string osm_id = 1;
  // The name of the trail, if it has one.
  string name = 2;
  // The OpenStreetMap highway type: path, footway, track, bridleway, steps,
  // cycleway, etc.
  string highway = 3;
  // The surface, e.g. dirt, gravel, asphalt, rock. Empty if unknown.
  string surface = 4;
  // The SAC hiking difficulty scale, e.g. hiking, mountain_hiking,
  // demanding_mountain_hiking, alpine_hiking. Empty if unknown.
  string sac_scale = 5;
  // The classified terrain of the trail.
  Terrain terrain = 6;
  // Length of the trail inside the search area, in meters.
  double length_meters = 7;
  // The first point of the trail.
  LatLng start = 8;
  // The last point of the trail.
  LatLng end = 9;
  // The point of the trail closest to the search center.
  LatLng nearest_point = 10;
  // Distance from the search center to the nearest point, in meters.
  double distance_from_center_meters = 11;
  // The trail geometry. Only set if include_geometry was set.
  repeated LatLng geometry = 12;
}

// Terrain is a coarse classification of the surface underfoot.
enum Terrain {
  TERRAIN_UNSPECIFIED = 0;
  // Asphalt, concrete or paving stones.
  TERRAIN_PAVED = 1;
  // Gravel or compacted fire roads and tracks.
  TERRAIN_GRAVEL = 2;
  // Dirt, grass or forest singletrack.
  TERRAIN_TRAIL = 3;
  // Rocky, scree or demanding mountain trails (SAC scale T3 or above).
  TERRAIN_TECHNICAL = 4;
}

message FindTrailsResponse {
  // The trails found.
  repeated Trail trails = 1;
}

// PointOfInterestKind is the kind of a point of interest.
enum PointOfInterestKind {
  POINT_OF_INTEREST_KIND_UNSPECIFIED = 0;
  // A summit or peak.
  POINT_OF_INTEREST_KIND_PEAK = 1;
  // Drinking water, a spring or a water tap.
  POINT_OF_INTEREST_KIND_WATER = 2;
  // A car park.
  POINT_OF_INTEREST_KIND_PARKING = 3;
  // A viewpoint.
  POINT_OF_INTEREST_KIND_VIEWPOINT = 4;
  // A shelter, hut or alpine hut.
  POINT_OF_INTEREST_KIND_SHELTER = 5;
  // Public toilets.
  POINT_OF_INTEREST_KIND_TOILETS = 6;
  // A mountain pass or saddle.
  POINT_OF_INTEREST_KIND_SADDLE = 7;
  // A marked trailhead.
  POINT_OF_INTEREST_KIND_TRAILHEAD = 8;
}

message FindPointsOfInterestRequest {
  // The center of the search area.
  LatLng center = 1;
  // The search radius in meters. Defaults to 3000, maximum 15000.
  double radius_meters = 2;
  // The kinds of points to find. Defaults to all kinds.
  repeated PointOfInterestKind kinds = 3;
  // Maximum number of results. Defaults to 100, maximum 500.
  int32 limit = 4;
}

// A point of interest.
message PointOfInterest {
  // The OpenStreetMap node ID, or way ID for an area such as a car park.
  string osm_id = 1;
  // The kind of point.
  PointOfInterestKind kind = 2;
  // The name of the point, if it has one.
  string name = 3;
  // The location of the point, the center of an area.
  LatLng location = 4;
  // The elevation in meters, from OpenStreetMap or else the elevation model. 0
  // if unknown.
  double elevation_meters = 5;
  // Distance from the search center in meters.
  double distance_from_center_meters = 6;
}

message FindPointsOfInterestResponse {
  // The points found, nearest first.
  repeated PointOfInterest points = 1;
}

message GetElevationRequest {
  // The points to look up. Maximum 100.
  repeated LatLng points = 1;
}

message GetElevationResponse {
  // The elevation of each point in meters, in the same order as the request.
  repeated double elevations_meters = 1;
}

message GetPersonalHeatmapRequest {
  // The area to aggregate.
  BoundingBox bounds = 1;
  // The size of each grid cell in meters. Defaults to 100, minimum 25.
  double cell_size_meters = 2;
  // Only include activities that started on or after this date (YYYY-MM-DD).
  string start_date = 3;
  // Only include activities that started on or before this date (YYYY-MM-DD).
  string end_date = 4;
  // Maximum number of cells to return, highest count first. Defaults to 2000,
  // maximum 20000.
  int32 limit = 5;
}

// A grid cell in a heatmap.
message HeatmapCell {
  // The center of the cell.
  LatLng center = 1;
  // The number of distinct activities that passed through the cell.
  int32 activity_count = 2;
}

message ListFamiliarTrailsRequest {
  // The area to search, at most 30 km across.
  BoundingBox bounds = 1;
  // Only count activities that started on or after this date (YYYY-MM-DD).
  string start_date = 2;
  // Only count activities that started on or before this date (YYYY-MM-DD).
  string end_date = 3;
  // Maximum number of trails to return, the most run first. Defaults to 50,
  // maximum 200.
  int32 limit = 4;
}

// A trail or road the user has run.
message FamiliarTrail {
  // The way. Its length_meters is its length in the bounds, and its start
  // and end are where the part the user ran starts and ends. Its
  // nearest_point and distance_from_center_meters are unset.
  Trail trail = 1;
  // How many activities ran along the way's most run part.
  int32 activity_count = 2;
  // How much of the way the user has run, in meters.
  double run_length_meters = 3;
}

message ListFamiliarTrailsResponse {
  // The trails, the most run first, then the longest run.
  repeated FamiliarTrail trails = 1;
  // Whether some activities were left out, as there were too many. The
  // 1,000 most recent activities in the area are counted; use dates or a
  // smaller area to count others.
  bool truncated = 2;
}

message ListHeatmapTracksRequest {
  // The area to list the tracks in.
  BoundingBox bounds = 1;
  // How far in meters the simplified tracks may stray from the recorded
  // ones. Defaults to 10, minimum 1. The tracks are stored simplified to 2
  // meters, and from 50 meters, or for areas more than 100 km across, the
  // activities' summary polylines are used, which are much faster to list.
  double tolerance_meters = 2;
}

message ListHeatmapTracksResponse {
  // The parts of the tracks inside the bounds, as encoded polylines.
  repeated string polylines = 1;
  // Whether there were too many tracks or points to return all of them. The
  // tracks of the 1,000 most recent activities are listed, and of those the
  // longest parts are returned first. Use a smaller area to see the rest.
  bool truncated = 2;
}

message GetPersonalHeatmapResponse {
  // The cells with at least one activity, highest count first.
  repeated HeatmapCell cells = 1;
  // The size of each cell in meters.
  double cell_size_meters = 2;
  // The number of activities that intersected the bounds and were counted.
  int32 activity_count = 3;
  // Whether there were too many activities in the bounds to count all of
  // them, so only the most recent (up to 1,000) were. Use a smaller area or
  // date range to count them all.
  bool truncated = 4;
}

message GetAvalancheForecastRequest {
  // The point to get the forecast for.
  LatLng location = 1;
}

message GetAvalancheForecastResponse {
  // The forecast for the point's area, unset if there is none.
  AvalancheForecast forecast = 1;
}

// A danger rating of the North American Public Avalanche Danger Scale. The
// numbers are the scale's levels, so higher is more dangerous.
enum AvalancheDanger {
  // Not rated, e.g. early in the season, in spring conditions or without
  // enough information: see the rating's description, and expect
  // avalanches anyway.
  AVALANCHE_DANGER_UNSPECIFIED = 0;
  // 1 - Low: generally safe avalanche conditions. Watch for unstable snow
  // on isolated terrain features.
  AVALANCHE_DANGER_LOW = 1;
  // 2 - Moderate: heightened avalanche conditions on specific terrain
  // features. Evaluate snow and terrain carefully.
  AVALANCHE_DANGER_MODERATE = 2;
  // 3 - Considerable: dangerous avalanche conditions. Careful snowpack
  // evaluation, cautious route-finding and conservative decision-making
  // are essential.
  AVALANCHE_DANGER_CONSIDERABLE = 3;
  // 4 - High: very dangerous avalanche conditions. Travel in avalanche
  // terrain is not recommended.
  AVALANCHE_DANGER_HIGH = 4;
  // 5 - Extreme: avoid all avalanche terrain.
  AVALANCHE_DANGER_EXTREME = 5;
}

// The danger rating of an elevation band.
message AvalancheDangerRating {
  // The danger, unspecified if not rated.
  AvalancheDanger danger = 1;
  // How the forecast names the rating, e.g. "3 - Considerable" or "Early
  // Season".
  string description = 2;
}

// The danger ratings of a day, by elevation band.
message AvalancheDangerDay {
  // The date (YYYY-MM-DD), local to the forecast's area.
  string date = 1;
  // Above treeline: open, often glaciated terrain.
  AvalancheDangerRating alpine = 2;
  // Near treeline: the transition from forest to the alpine.
  AvalancheDangerRating treeline = 3;
  // Below treeline: forested terrain.
  AvalancheDangerRating below_treeline = 4;
}

// A kind of avalanche to expect.
message AvalancheProblem {
  // The problem's identifier, e.g. "windslab", "stormslab",
  // "persistentslab", "deeppersistentslab", "wetslab", "wetloose",
  // "dryloose" or "cornice".
  string type = 1;
  // Its name, e.g. "Wind Slab".
  string name = 2;
  // The elevation bands it's found in, e.g. "Alpine", "Treeline" and
  // "Below Treeline".
  repeated string elevations = 3;
  // The aspects of the slopes it's found on, in compass order, e.g. "N",
  // "NE".
  repeated string aspects = 4;
  // How likely avalanches are, e.g. "Possible to likely".
  string likelihood = 5;
  // The expected sizes on the Canadian destructive size scale, from 1
  // (relatively harmless to people) through 2 (could bury, injure or kill
  // a person) and 3 (could bury and destroy a car) to 5, in half steps. 0
  // if not given.
  double min_size = 6;
  double max_size = 7;
  // The forecaster's description of the problem.
  string comment = 8;
}

// An avalanche forecast for an area, for the next three days.
message AvalancheForecast {
  // The name of the forecast's area, e.g. "Glacier".
  string title = 1;
  // Who wrote the forecast, e.g. "Avalanche Canada" or "Parks Canada".
  // Credit them when showing it.
  string forecaster = 2;
  // The full forecast on avalanche.ca. Link to it when showing the
  // forecast.
  string url = 3;
  // When the forecast was issued.
  google.protobuf.Timestamp issue_time = 4;
  // When it expires, unset if not given.
  google.protobuf.Timestamp valid_until_time = 5;
  // The forecast's summary.
  string highlights = 6;
  // The forecaster's confidence, e.g. "Moderate", empty if not rated.
  string confidence = 7;
  // The danger ratings of each day, in date order.
  repeated AvalancheDangerDay days = 8;
  // The avalanche problems to expect, the most important first.
  repeated AvalancheProblem problems = 9;
  // Advice on choosing terrain and traveling in it.
  repeated string travel_advice = 10;
}

// Whether to go on a ski tour, from checking its forecast against the
// user's touring limits.
enum TouringVerdictLevel {
  TOURING_VERDICT_LEVEL_UNSPECIFIED = 0;
  // Within all the user's limits.
  TOURING_VERDICT_LEVEL_GO = 1;
  // Close to a limit, or a limit can't be checked, like without an
  // avalanche forecast for the day or when the danger isn't rated.
  TOURING_VERDICT_LEVEL_CAUTION = 2;
  // Beyond one of the user's limits.
  TOURING_VERDICT_LEVEL_NO_GO = 3;
}

// The result of checking one of the user's touring limits.
message TouringCheck {
  // The check's verdict.
  TouringVerdictLevel level = 1;
  // What was found, e.g. "Gusts up to 75 km/h, above your limit of 60
  // km/h".
  string message = 2;
}

// A verdict on a ski tour, from checking its forecast against the user's
// own touring limits (see plans.v1.TrainingPlanService.GetTouringLimits).
// It's the user's own rule, not advice: tell them the checks that aren't a
// go, and leave the decision to them.
message TouringVerdict {
  // The overall verdict, the worst of the checks.
  TouringVerdictLevel level = 1;
  // The checks of the limits the user has set, in the order avalanche
  // danger, gusts, freezing level and new snow.
  repeated TouringCheck checks = 2;
}
