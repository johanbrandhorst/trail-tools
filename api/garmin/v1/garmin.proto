syntax = "proto3";

package garmin.v1;

import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// GarminService manages the connection to the user's Garmin Connect account.
// Once connected, the user's activities come straight from Garmin, with the
// sets of strength workouts, alongside any from Strava: an activity on both
// is one activity. The runs and strength workouts of the coming week are put
// on the user's Garmin Connect calendar, and the routes of upcoming runs and
// races are put on it as courses, which Garmin syncs to their watch. Workouts
// are removed from Garmin a day after their date, and once done, so they
// don't fill the watch, which holds a limited number. The account is
// connected in the browser by visiting /garmin/connect.
service GarminService {
  // Get the status of the Garmin connection.
  rpc GetGarminConnection(GetGarminConnectionRequest) returns (GetGarminConnectionResponse);
  // Put the upcoming workouts and their routes' courses on the user's Garmin
  // account now, and
  // download the activities Garmin sent that are waiting. This also
  // happens on its own after workouts change and every hour.
  rpc SyncGarmin(SyncGarminRequest) returns (SyncGarminResponse);
  // Disconnect the Garmin account, removing the workouts put on its
  // calendar. Synced activities are kept.
  rpc DisconnectGarmin(DisconnectGarminRequest) returns (DisconnectGarminResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Put a route on the user's Garmin account as a course now, for their
  // watch to navigate, whether or not a workout runs it. It stays there,
  // updated when the route changes, until it's removed with
  // RemoveRouteFromGarmin. Garmin syncs it to the watch. Fails with
  // FAILED_PRECONDITION without a Garmin connection that allows courses.
  rpc SendRouteToGarmin(SendRouteToGarminRequest) returns (SendRouteToGarminResponse);
  // Remove a route sent with SendRouteToGarmin from the user's Garmin
  // account. The route of an upcoming workout stays until the workout is
  // past.
  rpc RemoveRouteFromGarmin(RemoveRouteFromGarminRequest) returns (RemoveRouteFromGarminResponse);
  // Get whether a route is on the user's Garmin account as a course.
  rpc GetRouteGarminStatus(GetRouteGarminStatusRequest) returns (GetRouteGarminStatusResponse);
}

// The status of the Garmin connection.
message GarminConnection {
  // Whether a Garmin account is connected.
  bool connected = 1;
  // Whether the server is configured with Garmin API credentials.
  bool configured = 2;
  // Whether the user lets the app read their activities.
  bool activities_allowed = 3;
  // Whether the user lets the app put workouts on their calendar.
  bool workouts_allowed = 4;
  // When workouts were last put on the calendar. Unset if never.
  google.protobuf.Timestamp workouts_sync_time = 5;
  // What the last sync did, or why it failed.
  string sync_message = 6;
  // How many workouts are on the Garmin calendar.
  int32 workout_count = 7;
  // How many activity files are waiting to be downloaded.
  int32 pending_file_count = 8;
  // Whether the user lets the app put the routes of their upcoming runs and
  // races on their Garmin account as courses, for the watch to navigate.
  bool courses_allowed = 9;
  // How many courses are on the Garmin account.
  int32 course_count = 10;
}

message GetGarminConnectionRequest {}

message GetGarminConnectionResponse {
  // The connection status.
  GarminConnection connection = 1;
}

message SyncGarminRequest {}

message SyncGarminResponse {
  // The connection status after the sync.
  GarminConnection connection = 1;
}

message DisconnectGarminRequest {}

message DisconnectGarminResponse {}

// Whether a route is on the user's Garmin account as a course.
message RouteGarminStatus {
  // Whether the route's course is on Garmin, sent by the user or for an
  // upcoming workout.
  bool on_garmin = 1;
  // Whether the user sent it, so it stays until they remove it.
  bool sent = 2;
}

message SendRouteToGarminRequest {
  // The ID of the route.
  string route_id = 1;
}

message SendRouteToGarminResponse {
  // The route's status after sending it.
  RouteGarminStatus status = 1;
}

message RemoveRouteFromGarminRequest {
  // The ID of the route.
  string route_id = 1;
}

message RemoveRouteFromGarminResponse {
  // The route's status after removing it.
  RouteGarminStatus status = 1;
}

message GetRouteGarminStatusRequest {
  // The ID of the route.
  string route_id = 1;
}

message GetRouteGarminStatusResponse {
  // The route's status.
  RouteGarminStatus status = 1;
}
