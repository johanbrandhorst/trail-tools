syntax = "proto3";

package strava.v1;

import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// StravaService manages the connection to the user's Strava account and the
// syncing of activities. The account is connected in the browser by visiting
// /strava/connect.
service StravaService {
  // Get the status of the Strava connection and the most recent sync.
  rpc GetStravaConnection(GetStravaConnectionRequest) returns (GetStravaConnectionResponse);
  // Start syncing activities from Strava in the background. New activities
  // are fetched first, followed by detailed data streams for each activity.
  // Strava's API rate limits mean a full history sync can take hours; it
  // resumes automatically. Use GetStravaConnection to follow progress.
  rpc SyncStrava(SyncStravaRequest) returns (SyncStravaResponse);
  // Sync the details, photos and streams of an activity still waiting for
  // them right away, ahead of the other activities. If Strava's rate limit
  // is reached, the activity is synced first once it resets.
  rpc SyncActivity(SyncActivityRequest) returns (SyncActivityResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Disconnect the Strava account, revoking the app's access on Strava.
  // Strava's API agreement only lets the app keep the data it got from
  // Strava with the user's agreement, so the activities from Strava are
  // deleted unless keep_activities is set. The user does this in the web
  // app.
  rpc DisconnectStrava(DisconnectStravaRequest) returns (DisconnectStravaResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Record whether the user agrees to keep their activities from Strava on
  // trailrunn.ing if Strava is disconnected, including by revoking the
  // app's access on Strava, when there's no chance to ask. The user's own
  // agreement, so only the user sets it, in the web app.
  rpc SetStravaKeepActivities(SetStravaKeepActivitiesRequest) returns (SetStravaKeepActivitiesResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Start importing the user's activities from their Strava archive: the
  // zip of their data that Strava emails them, requested on Strava under
  // Settings, My Account, Download or Delete Your Account. Strava needn't
  // be connected. The web app reads the archive in the browser, sends its
  // activities.csv here, then sends each activity's file with
  // ImportStravaArchiveActivity, so the archive's photos and other data
  // never leave the device. Activities imported from an archive came from
  // the user rather than Strava's API, so they stay when Strava is
  // disconnected. Starting again replaces an unfinished import.
  rpc StartStravaArchiveImport(StartStravaArchiveImportRequest) returns (StartStravaArchiveImportResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Import an activity of the archive whose import was started, with its
  // original file from the archive, if it has one.
  rpc ImportStravaArchiveActivity(ImportStravaArchiveActivityRequest) returns (ImportStravaArchiveActivityResponse) {
    option (mcp.v1.method).exclude = true;
  }
}

// SyncState is the state of a Strava sync.
enum SyncState {
  SYNC_STATE_UNSPECIFIED = 0;
  // No sync is running.
  SYNC_STATE_IDLE = 1;
  // A sync is running.
  SYNC_STATE_RUNNING = 2;
  // A sync is paused until the Strava rate limit resets.
  SYNC_STATE_RATE_LIMITED = 3;
  // The last sync failed.
  SYNC_STATE_FAILED = 4;
}

// The status of the Strava connection.
message StravaConnection {
  // Whether a Strava account is connected.
  bool connected = 1;
  // The name of the connected Strava athlete.
  string athlete_name = 2;
  // The Strava athlete ID.
  string athlete_id = 3;
  // The state of the sync.
  SyncState sync_state = 4;
  // A message describing the sync state, such as an error.
  string sync_message = 5;
  // When the last successful sync finished.
  google.protobuf.Timestamp last_sync_time = 6;
  // When a rate limited sync will resume.
  google.protobuf.Timestamp resume_time = 7;
  // The number of synced activities.
  int32 activity_count = 8;
  // The number of synced activities still waiting for detailed streams.
  int32 pending_stream_count = 9;
  // Whether the server is configured with Strava API credentials.
  bool configured = 10;
  // The page of the connected Strava athlete on Strava.
  string athlete_url = 11;
  // Whether the user agreed to keep their activities from Strava if Strava
  // is disconnected. Without it, disconnecting deletes the activities that
  // came from Strava: those also on Garmin Connect keep Garmin's data, and
  // those imported from the user's own Strava archive stay.
  bool keep_activities = 12;
  // Whether the activities from an earlier connection are being deleted, as
  // Strava was disconnected without keeping them. It takes a few minutes
  // for a long history.
  bool deleting_activities = 13;
}

message GetStravaConnectionRequest {}

message GetStravaConnectionResponse {
  // The connection status.
  StravaConnection connection = 1;
}

message SyncStravaRequest {
  // Re-fetch all activities rather than only new ones. Use this to pick up
  // edits made on Strava.
  bool full = 1;
}

message SyncStravaResponse {
  // The connection status after starting the sync.
  StravaConnection connection = 1;
}

message SyncActivityRequest {
  // The ID of the activity.
  string activity_id = 1;
}

message SyncActivityResponse {
  // Whether the activity's details, photos and streams are synced.
  bool synced = 1;
  // If the activity isn't synced because Strava's rate limit was reached,
  // when the limit resets. The activity is synced before the other
  // activities then.
  google.protobuf.Timestamp resume_time = 2;
}

message DisconnectStravaRequest {
  // Whether the user agrees to keep their activities from Strava on
  // trailrunn.ing. If not, they're deleted, as described in
  // StravaConnection.keep_activities.
  bool keep_activities = 1;
}

message DisconnectStravaResponse {
  // The connection status after disconnecting.
  StravaConnection connection = 1;
}

message SetStravaKeepActivitiesRequest {
  // Whether the user agrees to keep their activities from Strava if Strava
  // is disconnected.
  bool keep_activities = 1;
}

message SetStravaKeepActivitiesResponse {
  // The connection status.
  StravaConnection connection = 1;
}

message StartStravaArchiveImportRequest {
  // The archive's activities.csv.
  string activities_csv = 1;
}

// An activity of a Strava archive to import.
message StravaArchiveActivity {
  // Strava's ID of the activity.
  string strava_id = 1;
  // The activity's name.
  string name = 2;
  // The path of the activity's original file in the archive, like
  // "activities/22115185543.fit.gz", or empty for an activity without one,
  // like one entered by hand.
  string filename = 3;
}

message StartStravaArchiveImportResponse {
  // The activities to import, the most recent first.
  repeated StravaArchiveActivity activities = 1;
  // How many of the archive's activities were imported from an archive
  // before, and are skipped.
  int32 already_imported_count = 2;
  // How many rows of activities.csv couldn't be read, as they lack an ID or
  // a start time.
  int32 unreadable_count = 3;
}

message ImportStravaArchiveActivityRequest {
  // Strava's ID of the activity, as StartStravaArchiveImport listed it.
  string strava_id = 1;
  // The activity's file from the archive, as it is there: FIT, GPX or TCX,
  // gzipped if its name ends in ".gz". Empty for an activity without one.
  bytes file = 2;
}

message ImportStravaArchiveActivityResponse {
  // The ID of the imported activity.
  string activity_id = 1;
  // Whether the activity's file couldn't be read, so it was imported
  // without its samples.
  bool file_unreadable = 2;
}
