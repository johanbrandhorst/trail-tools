syntax = "proto3";

package races.v1;

import "geo/v1/geo.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/image.proto";
import "mcp/v1/options.proto";
import "routes/v1/routes.proto";
import "trips/v1/trips.proto";

// RaceReportService manages race reports: the story of a race the user ran,
// focused on how it was prepared for and executed.
// A report has a result and sections of text: a summary, preparation, race
// day, nutrition, what went well and badly, and lessons. The result is a
// finish time, or, if the runner did not finish (DNF), where and when they
// stopped. The server compares the race plan with what happened: the result
// against the plan's A, B and C goals, and the actual arrival times at the
// plan's checkpoints, from the activity's recording or the race day splits,
// against the planned ones. A DNF meets no goal, and has no arrival times
// beyond where the runner stopped.
//
// A report can also have segments: stretches of the race's track, like "The
// climb to Galbraith", with a title and text, which the app highlights on a
// map and elevation profile. The track is a copy of the activity's, made when
// the activity is set; segments are distances along it. SuggestRaceReportSegments
// suggests segments from the climbs and descents of the track, to write
// about.
//
// A report can also have photos, shown in the order they were taken, with
// captions, and on the map of its track. The author uploads them in the app,
// and agents can upload the user's photo files with
// CreateRaceReportPhotoUpload; each photo is placed on the track at the time
// it was taken, or else at its GPS position.
//
// Reports are private drafts until the author publishes them in the app,
// which requires a public profile (see TripReportService). Help the author
// by drafting and editing the sections from what they tell you and the
// comparison.
service RaceReportService {
  // Create a draft race report on one of the user's races. The race's name,
  // date, distance and elevation gain are copied, and the activity, the
  // user's longest on the race date unless set, gives the finish time.
  rpc CreateRaceReport(CreateRaceReportRequest) returns (CreateRaceReportResponse);
  // Get one of the user's race reports, with the comparison with the plan.
  rpc GetRaceReport(GetRaceReportRequest) returns (GetRaceReportResponse);
  // List the user's race reports, most recent race first.
  rpc ListRaceReports(ListRaceReportsRequest) returns (ListRaceReportsResponse);
  // Update a race report. Only the fields that are set are changed.
  rpc UpdateRaceReport(UpdateRaceReportRequest) returns (UpdateRaceReportResponse);
  // Delete a race report.
  rpc DeleteRaceReport(DeleteRaceReportRequest) returns (DeleteRaceReportResponse);
  // Replace the segments of a race report, in order along the track. The
  // report needs a track, from its activity.
  rpc SetRaceReportSegments(SetRaceReportSegmentsRequest) returns (SetRaceReportSegmentsResponse);
  // Suggest segments for a race report from the climbs and descents of its
  // track, each named like "Climb to 1,450 m", without text. Nothing is
  // saved: set the segments to keep them, with text the author writes. Fails
  // with FAILED_PRECONDITION if the report has no track, or the track has no
  // elevations.
  rpc SuggestRaceReportSegments(SuggestRaceReportSegmentsRequest) returns (SuggestRaceReportSegmentsResponse);
  // Upload a photo to a race report. The image is stored as a JPEG of at
  // most 2048 pixels and a thumbnail, without its metadata. It's placed on
  // the track at the time it was taken, if that was during the activity, or
  // else at its GPS position, and among the report's photos in the order
  // they were taken.
  rpc UploadRaceReportPhoto(UploadRaceReportPhotoRequest) returns (UploadRaceReportPhotoResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Create a link to upload photos to a race report with, for agents that
  // can read the user's photo files and make HTTP requests, e.g. with a
  // shell, as tools can't take files. Upload each photo with a POST request
  // to the link with the file as the body, e.g.
  // `curl --data-binary @IMG_1234.jpg '<url>'`, or as the file of a multipart
  // form, e.g. `curl -F file=@IMG_1234.jpg '<url>'`. Set a caption with the
  // caption query parameter or form field, e.g.
  // `--url-query 'caption=The last climb'`. Each upload responds with
  // {"photo": RaceReportPhoto} as JSON, or with an error as
  // {"code": "...", "message": "..."}.
  //
  // JPEG, PNG and WebP files of up to 20 MB are accepted. Convert HEIC
  // photos, as iPhones take them, to JPEG first, keeping their metadata, e.g.
  // with `sips -s format jpeg IMG_1234.HEIC --out IMG_1234.jpg` on macOS. Each
  // photo is placed on the track from the time and GPS position in its
  // metadata, like photos uploaded in the app; look at them with
  // GetRaceReportPhoto to write their captions. The link uploads any number
  // of photos for an hour; create another one when it expires. Anyone with
  // the link can add photos to the report, so don't share it.
  rpc CreateRaceReportPhotoUpload(CreateRaceReportPhotoUploadRequest) returns (CreateRaceReportPhotoUploadResponse);
  // Update the caption or the location of a photo of a race report.
  rpc UpdateRaceReportPhoto(UpdateRaceReportPhotoRequest) returns (UpdateRaceReportPhotoResponse);
  // Delete a photo of a race report.
  rpc DeleteRaceReportPhoto(DeleteRaceReportPhotoRequest) returns (DeleteRaceReportPhotoResponse);
  // Get a photo of one of the user's race reports with its image, to look
  // at it, e.g. to write its caption or the story around it. The thumbnail
  // is enough to see what's in a photo; get the large image for details.
  rpc GetRaceReportPhoto(GetRaceReportPhotoRequest) returns (GetRaceReportPhotoResponse);
  // Publish a race report on the user's public profile.
  rpc PublishRaceReport(PublishRaceReportRequest) returns (PublishRaceReportResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Unpublish a race report, making it a private draft again.
  rpc UnpublishRaceReport(UnpublishRaceReportRequest) returns (UnpublishRaceReportResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // List the published race reports of a public profile. Doesn't require
  // authentication.
  rpc ListPublicRaceReports(ListPublicRaceReportsRequest) returns (ListPublicRaceReportsResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Get a published race report by its author's handle and its slug.
  // Doesn't require authentication. Authors can also get their drafts.
  rpc GetPublicRaceReport(GetPublicRaceReportRequest) returns (GetPublicRaceReportResponse) {
    option (mcp.v1.method).exclude = true;
  }
}

// A race report.
message RaceReport {
  // The ID of the report.
  string id = 1 [(mcp.v1.field).output_only = true];
  // The ID of the race, if it still exists. See RaceService.
  string race_id = 2 [(mcp.v1.field).output_only = true];
  // The ID of the activity of the race, if any. See ActivityService.
  string activity_id = 3;
  // The title.
  string title = 4;
  // The last part of the report's URL: lowercase letters, digits and dashes,
  // unique among the author's race reports. Defaults to the title.
  string slug = 5;
  // The name of the race, copied from it.
  string race_name = 6 [(mcp.v1.field).output_only = true];
  // The date of the race (YYYY-MM-DD).
  string race_date = 7 [(mcp.v1.field).output_only = true];
  // The race distance in meters.
  double distance_meters = 8 [(mcp.v1.field).output_only = true];
  // The race's elevation gain in meters.
  double elevation_gain_meters = 9 [(mcp.v1.field).output_only = true];
  // The finish time in seconds, 0 if unknown or the runner did not finish.
  int32 finish_seconds = 10;
  // The placement as free text, e.g. "12th of 240, 3rd M40".
  string placement = 11;
  // A short summary of the race.
  string summary = 12;
  // How the race was prepared for: the training block, taper, recce.
  string preparation = 13;
  // How the race went: pacing, the course, conditions, low and high points.
  string race_day = 14;
  // Fueling and hydration: what was planned, what was eaten, problems.
  string nutrition = 15;
  // What went well.
  string went_well = 16;
  // What went badly.
  string went_badly = 17;
  // Lessons for the next race.
  string lessons = 18;
  // Whether the report is published.
  bool published = 19 [(mcp.v1.field).output_only = true];
  // When the report was first published.
  google.protobuf.Timestamp publish_time = 20 [(mcp.v1.field).output_only = true];
  // The public URL of the report, if the author has a public profile. Only
  // reachable by others once published.
  string url = 21 [(mcp.v1.field).output_only = true];
  // When the report was created.
  google.protobuf.Timestamp create_time = 22 [(mcp.v1.field).output_only = true];
  // When the report was last updated.
  google.protobuf.Timestamp update_time = 23 [(mcp.v1.field).output_only = true];
  // Whether the runner did not finish the race (DNF). The result is then
  // where and when they stopped, and there is no finish time.
  bool did_not_finish = 24;
  // Where the runner stopped, as the distance along the course from the
  // start in meters, 0 if unknown. Only for a DNF.
  double stop_distance_meters = 25;
  // The checkpoint or place where the runner stopped, e.g. "Function
  // Junction", if any. Only for a DNF. If it's one of the race plan's
  // checkpoints, the runner reached it.
  string stop_checkpoint = 26;
  // The elapsed time when the runner stopped in seconds, 0 if unknown. Only
  // for a DNF.
  int32 stop_seconds = 27;
  // The segments: stretches of the track the runner comments on, in order.
  // Set with SetRaceReportSegments. Not set in lists.
  repeated RaceReportSegment segments = 28 [(mcp.v1.field).output_only = true];
  // Whether the report has a track, from its activity, which segments need.
  bool has_track = 29 [(mcp.v1.field).output_only = true];
  // The photos, in the order they were taken. Not set in lists.
  repeated RaceReportPhoto photos = 30 [(mcp.v1.field).output_only = true];
}

// A photo of a race report.
message RaceReportPhoto {
  // The ID of the photo.
  string id = 1 [(mcp.v1.field).output_only = true];
  // The caption.
  string caption = 2;
  // Where the photo was taken. Unset if unknown.
  geo.v1.LatLng location = 3;
  // Where the location comes from.
  trips.v1.LocationSource location_source = 4 [(mcp.v1.field).output_only = true];
  // The distance along the report's track of the point nearest to the
  // location, in meters. Unset if the photo has no location or the report
  // has no track.
  optional double track_distance_meters = 5 [(mcp.v1.field).output_only = true];
  // When the photo was taken, if known.
  google.protobuf.Timestamp taken_time = 6 [(mcp.v1.field).output_only = true];
  // The width of the image in pixels.
  int32 width = 7 [(mcp.v1.field).output_only = true];
  // The height of the image in pixels.
  int32 height = 8 [(mcp.v1.field).output_only = true];
  // The URL of the image, at most 2048 pixels on the long side.
  string url = 9 [(mcp.v1.field).output_only = true];
  // The URL of a thumbnail, at most 480 pixels on the long side.
  string thumbnail_url = 10 [(mcp.v1.field).output_only = true];
}

// A stretch of a race report's track the runner comments on.
message RaceReportSegment {
  // The heading, e.g. "The climb to Galbraith". At most 200 characters.
  string title = 1;
  // The text as plain text. Paragraphs are separated by blank lines.
  string body = 2;
  // Where the stretch starts and ends, in meters along the report's track.
  // The end must be after the start, and within the track.
  double start_distance_meters = 3;
  double end_distance_meters = 4;
}

// The comparison of a race plan with what happened.
message RaceComparison {
  // Whether the race has a plan to compare with. See RacePlanService.
  bool has_plan = 1;
  // The goals of the plan and whether the result met them.
  repeated GoalResult goals = 2;
  // The planned finish time in seconds, from the plan's checkpoints. 0 if
  // the plan has none.
  int32 planned_finish_seconds = 3;
  // The plan's checkpoints with the planned and actual arrival times.
  repeated CheckpointResult checkpoints = 4;
  // Where the actual times come from.
  ActualTimesSource actual_times_source = 5;
  // Whether the activity's distances were scaled to the race's, as GPS
  // distances differ from course distances. They are only scaled when the
  // activity covers the course, or up to where the runner stopped for a DNF,
  // so a partial recording is never stretched over the whole course.
  bool actual_times_scaled = 6;
}

// Where the actual times of a race come from.
enum ActualTimesSource {
  // There are no actual times.
  ACTUAL_TIMES_SOURCE_UNSPECIFIED = 0;
  // The recording of the race's activity.
  ACTUAL_TIMES_SOURCE_ACTIVITY = 1;
  // The checkpoint splits recorded on race day.
  ACTUAL_TIMES_SOURCE_RACE_DAY = 2;
}

// A goal of a race plan and the result against it.
message GoalResult {
  // The goal: A, B or C.
  string goal = 1;
  // The goal's finish time in seconds.
  int32 target_seconds = 2;
  // Whether the finish time met the goal. False without a finish time,
  // and if the runner did not finish.
  bool met = 3;
  // The finish time minus the goal, in seconds: negative if faster. 0
  // without a finish time, and if the runner did not finish.
  int32 difference_seconds = 4;
}

// A checkpoint of a race plan with the planned and actual arrival times.
message CheckpointResult {
  // The name of the checkpoint.
  string name = 1;
  // The distance from the start in meters.
  double distance_meters = 2;
  // The planned elapsed time at arrival in seconds.
  int32 planned_arrival_seconds = 3;
  // The actual elapsed time at arrival in seconds, if known. Never set
  // beyond the end of the activity's recording, nor beyond where the runner
  // stopped if they did not finish.
  optional int32 actual_arrival_seconds = 4;
  // The actual minus the planned arrival in seconds: negative if early.
  // Set with the actual arrival.
  optional int32 difference_seconds = 5;
  // The cutoff as elapsed time in seconds, 0 if none.
  int32 cutoff_seconds = 6;
  // Whether the runner did not reach the checkpoint because they did not
  // finish: it's beyond where they stopped.
  bool not_reached = 7;
}

message CreateRaceReportRequest {
  // The ID of the race.
  string race_id = 1;
  // The ID of the activity of the race. Defaults to the user's longest
  // activity on the race date, if any.
  string activity_id = 2;
}

message CreateRaceReportResponse {
  // The created report.
  RaceReport report = 1;
  // The comparison with the race plan.
  RaceComparison comparison = 2;
}

message GetRaceReportRequest {
  // The ID of the report.
  string id = 1;
  // Whether to include the report's track.
  bool include_track = 2;
}

message GetRaceReportResponse {
  // The report.
  RaceReport report = 1;
  // The comparison with the race plan.
  RaceComparison comparison = 2;
  // The report's track, downsampled, if include_track was set and it has
  // one.
  repeated routes.v1.RoutePoint track = 3;
}

message ListRaceReportsRequest {
  // Only list the reports on this race, if set.
  string race_id = 1;
}

message ListRaceReportsResponse {
  // The reports, most recent race first.
  repeated RaceReport reports = 1;
}

message UpdateRaceReportRequest {
  // The ID of the report.
  string id = 1;
  // The new title, if set.
  optional string title = 2;
  // The new slug, if set. Can't be changed while published.
  optional string slug = 3;
  // The new activity, if set. Empty to unset it.
  optional string activity_id = 4;
  // The new finish time in seconds, if set. Must be 0 for a DNF.
  optional int32 finish_seconds = 5;
  // The new placement, if set.
  optional string placement = 6;
  // The new summary, if set.
  optional string summary = 7;
  // The new preparation section, if set.
  optional string preparation = 8;
  // The new race day section, if set.
  optional string race_day = 9;
  // The new nutrition section, if set.
  optional string nutrition = 10;
  // The new what went well section, if set.
  optional string went_well = 11;
  // The new what went badly section, if set.
  optional string went_badly = 12;
  // The new lessons section, if set.
  optional string lessons = 13;
  // Whether the runner did not finish (DNF), if set. Marking a report as a
  // DNF moves its finish time, e.g. the activity's elapsed time, to the stop
  // time, and defaults the stop distance to the activity's distance, unless
  // they are set. Marking it as finished clears where and when the runner
  // stopped.
  optional bool did_not_finish = 14;
  // The new distance along the course where the runner stopped in meters, if
  // set. Only for a DNF.
  optional double stop_distance_meters = 15;
  // The new checkpoint or place where the runner stopped, if set. Only for a
  // DNF.
  optional string stop_checkpoint = 16;
  // The new elapsed time when the runner stopped in seconds, if set. Only
  // for a DNF.
  optional int32 stop_seconds = 17;
}

message UploadRaceReportPhotoRequest {
  // The ID of the report.
  string report_id = 1;
  // The image, as a JPEG, PNG or WebP file.
  bytes data = 2;
  // The caption.
  string caption = 3;
  // The GPS position recorded in the photo, if any.
  geo.v1.LatLng location = 4;
  // When the photo was taken, if the time and its UTC offset are known.
  google.protobuf.Timestamp taken_time = 5;
  // When the photo was taken as a local time without an offset
  // (YYYY-MM-DDTHH:MM:SS), as recorded by most cameras. It is interpreted in
  // the timezone of the report's activity, or else as UTC. Ignored if
  // taken_time is set.
  string taken_local_time = 6;
}

message UploadRaceReportPhotoResponse {
  // The uploaded photo.
  RaceReportPhoto photo = 1;
}

message CreateRaceReportPhotoUploadRequest {
  // The ID of the report.
  string report_id = 1;
}

message CreateRaceReportPhotoUploadResponse {
  // The link to upload photos with.
  trips.v1.PhotoUpload upload = 1;
}

message UpdateRaceReportPhotoRequest {
  // The ID of the photo.
  string id = 1;
  // The new caption, if set. At most 2000 characters.
  optional string caption = 2;
  // The new location, if set. The location is then manual.
  geo.v1.LatLng location = 3;
  // Remove the location.
  bool clear_location = 4;
}

message UpdateRaceReportPhotoResponse {
  // The updated photo.
  RaceReportPhoto photo = 1;
}

message DeleteRaceReportPhotoRequest {
  // The ID of the photo.
  string id = 1;
}

message DeleteRaceReportPhotoResponse {}

message GetRaceReportPhotoRequest {
  // The ID of the photo.
  string id = 1;
  // The size of the image. Defaults to the thumbnail.
  trips.v1.PhotoSize size = 2;
}

message GetRaceReportPhotoResponse {
  // The photo.
  RaceReportPhoto photo = 1;
  // The photo's image, a JPEG.
  mcp.v1.Image image = 2;
}

message SetRaceReportSegmentsRequest {
  // The ID of the report.
  string report_id = 1;
  // The segments, at most 50. Empty to remove them all.
  repeated RaceReportSegment segments = 2;
}

message SetRaceReportSegmentsResponse {
  // The updated report.
  RaceReport report = 1;
}

message SuggestRaceReportSegmentsRequest {
  // The ID of the report.
  string report_id = 1;
}

message SuggestRaceReportSegmentsResponse {
  // The suggested segments, in order along the track, without text.
  repeated RaceReportSegment segments = 1;
}

message UpdateRaceReportResponse {
  // The updated report.
  RaceReport report = 1;
  // The comparison with the race plan.
  RaceComparison comparison = 2;
}

message DeleteRaceReportRequest {
  // The ID of the report.
  string id = 1;
}

message DeleteRaceReportResponse {}

message PublishRaceReportRequest {
  // The ID of the report.
  string id = 1;
}

message PublishRaceReportResponse {
  // The published report.
  RaceReport report = 1;
}

message UnpublishRaceReportRequest {
  // The ID of the report.
  string id = 1;
}

message UnpublishRaceReportResponse {
  // The unpublished report.
  RaceReport report = 1;
}

message ListPublicRaceReportsRequest {
  // The handle of the author.
  string handle = 1;
}

message ListPublicRaceReportsResponse {
  // The published reports, most recent race first.
  repeated RaceReport reports = 1;
}

message GetPublicRaceReportRequest {
  // The handle of the author.
  string handle = 1;
  // The slug of the report.
  string slug = 2;
}

message GetPublicRaceReportResponse {
  // The report. Photos taken in the author's privacy zones have no location.
  RaceReport report = 1;
  // The comparison with the race plan.
  RaceComparison comparison = 2;
  // The display name of the author.
  string author_name = 3;
  // The report's track, without the stretches in the author's privacy
  // zones, see UserService. Its distances are along the whole track, like the
  // segments'.
  repeated routes.v1.RoutePoint track = 4;
  // The indexes of the track's points that start a new piece of it, after a
  // stretch hidden in a privacy zone. Don't join them to the point before.
  repeated int32 track_breaks = 5;
}
