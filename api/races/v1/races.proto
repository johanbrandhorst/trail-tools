syntax = "proto3";

package races.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// RaceService manages the races the user could run, and which of them are on
// the user's calendar: the races the user is running. Races on the calendar
// can have race plans. Goal races of training plans are on the calendar.
//
// Races that belong together, like the races of a multi-day event, are
// grouped in a race event. Each race of an event keeps its own date, course,
// calendar status and race plan.
service RaceService {
  // Create a race. Races start off the user's calendar: only set on_calendar
  // when the user says they are running the race.
  rpc CreateRace(CreateRaceRequest) returns (CreateRaceResponse);
  // Get a race by ID.
  rpc GetRace(GetRaceRequest) returns (GetRaceResponse);
  // List the user's races in date order, or only those on the user's
  // calendar.
  rpc ListRaces(ListRacesRequest) returns (ListRacesResponse);
  // Update a race.
  rpc UpdateRace(UpdateRaceRequest) returns (UpdateRaceResponse);
  // Delete a race. Its race plans are deleted too.
  rpc DeleteRace(DeleteRaceRequest) returns (DeleteRaceResponse);
  // Create a race event, to group races that belong together, e.g. a 50 mile
  // race on the Saturday and a 50K on the Sunday. Add races to the event by
  // setting their event_id.
  rpc CreateRaceEvent(CreateRaceEventRequest) returns (CreateRaceEventResponse);
  // Get a race event by ID.
  rpc GetRaceEvent(GetRaceEventRequest) returns (GetRaceEventResponse);
  // List the user's race events, in the order of their first race.
  rpc ListRaceEvents(ListRaceEventsRequest) returns (ListRaceEventsResponse);
  // Update a race event.
  rpc UpdateRaceEvent(UpdateRaceEventRequest) returns (UpdateRaceEventResponse);
  // Delete a race event. Its races are kept, outside any event.
  rpc DeleteRaceEvent(DeleteRaceEventRequest) returns (DeleteRaceEventResponse);
}

// RacePriority is how important a race is to the season.
enum RacePriority {
  RACE_PRIORITY_UNSPECIFIED = 0;
  // A goal race the season is built around. Requires a full taper.
  RACE_PRIORITY_A = 1;
  // An important race. Requires a short taper.
  RACE_PRIORITY_B = 2;
  // A training race or tune-up. No taper.
  RACE_PRIORITY_C = 3;
}

// A race.
message Race {
  // The ID of the race. Ignored when creating a race.
  string id = 1;
  // The name of the race.
  string name = 2;
  // The date of the race (YYYY-MM-DD).
  string date = 3;
  // The local start time (HH:MM, 24 hour clock).
  string start_time = 4;
  // Where the race takes place.
  string location = 5;
  // The race website, an http or https link.
  string website_url = 6;
  // The race distance in meters.
  double distance_meters = 7;
  // The total elevation gain in meters.
  double elevation_gain_meters = 8;
  // The overall time limit in seconds. 0 if none.
  int32 cutoff_seconds = 9;
  // How important the race is.
  RacePriority priority = 10;
  // The ID of a route with the race course, e.g. imported from the race's GPX
  // file. Used to compute segment elevation in race plans.
  string course_route_id = 11;
  // Free text notes, e.g. terrain, weather, qualification requirements.
  string notes = 12;
  // Whether the race is on the user's calendar: the user is running it,
  // rather than considering it. Only races on the calendar can have race
  // plans. Making a race a goal race of a training plan adds it.
  bool on_calendar = 15;
  // The ID of the race event the race is part of, if any. Races that belong
  // together, like the days of a multi-day event, share an event. Name each
  // race in full, e.g. "Squamish 50 Mile" and "Squamish 50K".
  string event_id = 16;
  // When the race was created.
  google.protobuf.Timestamp create_time = 13 [(mcp.v1.field).output_only = true];
  // When the race was last updated.
  google.protobuf.Timestamp update_time = 14 [(mcp.v1.field).output_only = true];
}

message CreateRaceRequest {
  // The race to create.
  Race race = 1;
}

message CreateRaceResponse {
  // The created race.
  Race race = 1;
}

message GetRaceRequest {
  // The ID of the race.
  string id = 1;
}

message GetRaceResponse {
  // The race.
  Race race = 1;
}

message ListRacesRequest {
  // Only list the races on the user's calendar.
  bool on_calendar_only = 1;
}

message ListRacesResponse {
  // The user's races in date order.
  repeated Race races = 1;
}

message UpdateRaceRequest {
  // The race to update. The ID must be set.
  Race race = 1;
  // The fields to update, e.g. "date,course_route_id". If empty, all fields
  // are replaced.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateRaceResponse {
  // The updated race.
  Race race = 1;
}

message DeleteRaceRequest {
  // The ID of the race to delete.
  string id = 1;
}

message DeleteRaceResponse {}

// A race event groups races that belong together, e.g. a 50 mile race on the
// Saturday and a 50K on the Sunday, or the races of a festival weekend.
message RaceEvent {
  // The ID of the event. Ignored when creating an event.
  string id = 1;
  // The name of the event, e.g. "Squamish 50/50".
  string name = 2;
  // Where the event takes place.
  string location = 3;
  // The event website, an http or https link.
  string website_url = 4;
  // Free text notes, e.g. the combined results of a multi-day event.
  string notes = 5;
  // The IDs of the event's races, in date order.
  repeated string race_ids = 6 [(mcp.v1.field).output_only = true];
  // The date of the event's first race (YYYY-MM-DD). Empty if it has none.
  string start_date = 7 [(mcp.v1.field).output_only = true];
  // The date of the event's last race (YYYY-MM-DD). Empty if it has none.
  string end_date = 8 [(mcp.v1.field).output_only = true];
  // When the event was created.
  google.protobuf.Timestamp create_time = 9 [(mcp.v1.field).output_only = true];
  // When the event was last updated.
  google.protobuf.Timestamp update_time = 10 [(mcp.v1.field).output_only = true];
}

message CreateRaceEventRequest {
  // The event to create.
  RaceEvent event = 1;
}

message CreateRaceEventResponse {
  // The created event.
  RaceEvent event = 1;
}

message GetRaceEventRequest {
  // The ID of the event.
  string id = 1;
}

message GetRaceEventResponse {
  // The event.
  RaceEvent event = 1;
}

message ListRaceEventsRequest {}

message ListRaceEventsResponse {
  // The user's events, in the order of their first race. Events without
  // races come last.
  repeated RaceEvent events = 1;
}

message UpdateRaceEventRequest {
  // The event to update. The ID must be set.
  RaceEvent event = 1;
  // The fields to update, e.g. "name,website_url". If empty, all fields are
  // replaced.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateRaceEventResponse {
  // The updated event.
  RaceEvent event = 1;
}

message DeleteRaceEventRequest {
  // The ID of the event to delete.
  string id = 1;
}

message DeleteRaceEventResponse {}
