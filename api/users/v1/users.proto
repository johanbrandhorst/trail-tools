syntax = "proto3";

package users.v1;

import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// UserService provides information about the signed in user, and their
// settings.
service UserService {
  // Get the signed in user.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  // Create an API token. API tokens authenticate MCP clients and other API
  // clients with an "Authorization: Bearer <token>" header.
  rpc CreateAPIToken(CreateAPITokenRequest) returns (CreateAPITokenResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // List the user's API tokens.
  rpc ListAPITokens(ListAPITokensRequest) returns (ListAPITokensResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Delete an API token.
  rpc DeleteAPIToken(DeleteAPITokenRequest) returns (DeleteAPITokenResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Upload a picture to use as the user's avatar, replacing any previous
  // one. The middle square of the picture is used.
  rpc UploadAvatar(UploadAvatarRequest) returns (UploadAvatarResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Remove the user's avatar.
  rpc DeleteAvatar(DeleteAvatarRequest) returns (DeleteAvatarResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // List the user's privacy zones: places, like their home, around which
  // their tracks and photos are hidden on public pages.
  rpc ListPrivacyZones(ListPrivacyZonesRequest) returns (ListPrivacyZonesResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Replace the user's privacy zones.
  rpc SetPrivacyZones(SetPrivacyZonesRequest) returns (SetPrivacyZonesResponse) {
    option (mcp.v1.method).exclude = true;
  }
}

// A privacy zone: a circle around a place, like the user's home, within
// which their tracks and photos are hidden on public pages, like trip and
// race reports. The circle hidden is half the radius larger, and centered a
// quarter to half the radius away from the zone's center, in a secret
// direction that stays the same on every page. Otherwise the place at the
// center could be found from where several public tracks are cut.
message PrivacyZone {
  // The ID of the zone.
  string id = 1 [(mcp.v1.field).output_only = true];
  // A name for the user, e.g. "Home". At most 100 characters.
  string name = 2;
  // The center of the zone.
  double lat = 3;
  double lng = 4;
  // The radius of the zone in meters, from 100 to 5000.
  int32 radius_meters = 5;
}

message ListPrivacyZonesRequest {}

message ListPrivacyZonesResponse {
  // The user's zones, the oldest first.
  repeated PrivacyZone zones = 1;
}

message SetPrivacyZonesRequest {
  // The zones, at most 20. Empty to remove them all.
  repeated PrivacyZone zones = 1;
}

message SetPrivacyZonesResponse {
  // The user's zones.
  repeated PrivacyZone zones = 1;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string given_name = 4;
  string family_name = 5;
  // The URL of the user's avatar image, relative to the site. Empty if the
  // user has no avatar.
  string avatar_url = 6;
  // Whether the user is an administrator, who can invite new users.
  bool admin = 7;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

// An API token. The token secret is only returned when it is created.
message APIToken {
  // The ID of the token.
  string id = 1;
  // A name describing what the token is used for.
  string name = 2;
  // When the token was created.
  google.protobuf.Timestamp create_time = 3;
  // When the token was last used, if ever.
  google.protobuf.Timestamp last_used_time = 4;
}

message CreateAPITokenRequest {
  // A name describing what the token is used for.
  string name = 1;
}

message CreateAPITokenResponse {
  // The created token.
  APIToken token = 1;
  // The token secret. It is not stored and cannot be retrieved again.
  string secret = 2;
}

message ListAPITokensRequest {}

message ListAPITokensResponse {
  // The user's tokens.
  repeated APIToken tokens = 1;
}

message DeleteAPITokenRequest {
  // The ID of the token to delete.
  string id = 1;
}

message DeleteAPITokenResponse {}

message UploadAvatarRequest {
  // The picture, a JPEG, PNG or WebP image.
  bytes data = 1;
}

message UploadAvatarResponse {
  // The user, with the new avatar.
  User user = 1;
}

message DeleteAvatarRequest {}

message DeleteAvatarResponse {
  // The user, without an avatar.
  User user = 1;
}
